<!DOCTYPE html>
<html lang="zh-CN">
<head>
<base href="https://g7kza5chxrprm.ok.kimi.link">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本广场协定后经济书籍 | 深度阅读与研究</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #1a2332;
            --warm-gray: #6b7280;
            --amber-gold: #d97706;
            --ivory-white: #fefefe;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }

        .hero-title {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--amber-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .book-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.9);
        }

        .book-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .filter-tag {
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .filter-tag:hover {
            background: var(--amber-gold);
            color: white;
        }

        .filter-tag.active {
            background: var(--primary-blue);
            color: white;
        }

        .floating-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.1;
        }

        .nav-blur {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.9);
        }

        .section-fade {
            opacity: 0;
            transform: translateY(30px);
        }
    </style>
</head>
<body>
    <!-- 动态背景 -->
    <div id="floating-bg" class="floating-bg"></div>

    <!-- 导航栏 -->
    <nav class="fixed top-0 w-full z-50 nav-blur border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-8">
                    <h1 class="text-2xl font-bold text-gray-800" style="font-family: 'Noto Serif SC', serif;">
                        经济书房
                    </h1>
                    <div class="hidden md:flex space-x-6">
                        <a href="index.html" class="text-gray-700 hover:text-amber-600 transition-colors">书籍库</a>
                        <a href="timeline.html" class="text-gray-700 hover:text-amber-600 transition-colors">时间线</a>
                        <a href="compare.html" class="text-gray-700 hover:text-amber-600 transition-colors">对比分析</a>
                        <a href="community.html" class="text-gray-700 hover:text-amber-600 transition-colors">读书笔记</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="搜索书籍..."
                               class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">
                        <svg class="absolute left-3 top-2.5 h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要内容 -->
    <main class="pt-20">
        <!-- 英雄区域 -->
        <section class="py-16 px-6">
            <div class="max-w-7xl mx-auto text-center">
                <h2 class="hero-title text-5xl md:text-6xl font-bold mb-6 section-fade">
                    日本广场协定后的经济智慧
                </h2>
                <p class="text-xl text-gray-600 mb-8 max-w-3xl mx-auto section-fade">
                    深入探索1985年广场协定以来日本经济变迁的重要著作，从泡沫经济的形成到失落二十年的启示，为理解当代经济挑战提供历史镜鉴。
                </p>
                <div class="flex justify-center space-x-4 section-fade">
                    <button onclick="scrollToBooks()" class="bg-amber-600 hover:bg-amber-700 text-white px-8 py-3 rounded-lg transition-colors">
                        开始探索
                    </button>
                    <button onclick="window.location.href='timeline.html'" class="border border-gray-300 hover:border-amber-600 text-gray-700 px-8 py-3 rounded-lg transition-colors">
                        历史时间线
                    </button>
                </div>
            </div>
        </section>

        <!-- 筛选器区域 -->
        <section id="books-section" class="py-12 px-6">
            <div class="max-w-7xl mx-auto">
                <div class="bg-white rounded-2xl shadow-lg p-8 mb-12">
                    <h3 class="text-2xl font-bold text-gray-800 mb-6">智能筛选</h3>

                    <!-- 主题筛选 -->
                    <div class="mb-6">
                        <h4 class="text-lg font-semibold text-gray-700 mb-3">主题分类</h4>
                        <div class="flex flex-wrap gap-3">
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="theme" data-value="all">全部</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="theme" data-value="plaza">广场协定</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="theme" data-value="bubble">泡沫经济</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="theme" data-value="policy">货币政策</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="theme" data-value="industry">产业转型</span>
                        </div>
                    </div>

                    <!-- 作者国籍筛选 -->
                    <div class="mb-6">
                        <h4 class="text-lg font-semibold text-gray-700 mb-3">作者国籍</h4>
                        <div class="flex flex-wrap gap-3">
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="nationality" data-value="all">全部</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="nationality" data-value="japan">日本</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="nationality" data-value="usa">美国</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="nationality" data-value="china">中国</span>
                        </div>
                    </div>

                    <!-- 出版时间筛选 -->
                    <div class="mb-6">
                        <h4 class="text-lg font-semibold text-gray-700 mb-3">出版时间</h4>
                        <div class="flex flex-wrap gap-3">
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="period" data-value="all">全部</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="period" data-value="1985-1995">1985-1995</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="period" data-value="1995-2005">1995-2005</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="period" data-value="2005-2015">2005-2015</span>
                            <span class="filter-tag px-4 py-2 bg-gray-100 rounded-full text-sm" data-category="period" data-value="2015-now">2015至今</span>
                        </div>
                    </div>
                </div>

                <!-- 书籍网格 -->
                <div id="books-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                    <!-- 书籍卡片将通过JavaScript动态生成 -->
                </div>

                <!-- 加载更多按钮 -->
                <div class="text-center mt-12">
                    <button id="load-more" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-8 py-3 rounded-lg transition-colors">
                        加载更多
                    </button>
                </div>
            </div>
        </section>

        <!-- 特色推荐轮播 -->
        <section class="py-16 px-6 bg-gray-50">
            <div class="max-w-7xl mx-auto">
                <h3 class="text-3xl font-bold text-center text-gray-800 mb-12">编辑推荐</h3>
                <div class="splide" id="featured-carousel">
                    <div class="splide__track">
                        <ul class="splide__list">
                            <!-- 轮播内容将通过JavaScript生成 -->
                        </ul>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-12">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400">© 2025 经济书房. 致力于提供高质量的经济学阅读体验.</p>
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
