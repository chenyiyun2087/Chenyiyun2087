<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sina 买卖点监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        background: #f5f6fa;
        color: #1f2a44;
      }
      header {
        background: #1f2a44;
        color: #fff;
        padding: 20px 32px;
      }
      header h1 {
        margin: 0;
        font-size: 22px;
      }
      .container {
        padding: 24px 32px;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 10px 24px rgba(31, 42, 68, 0.08);
      }
      #chart-wrapper {
        height: 520px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      th,
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #eef0f4;
        text-align: left;
        font-size: 13px;
      }
      .legend {
        display: flex;
        gap: 16px;
        margin-top: 12px;
        font-size: 13px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
      }
      .buy {
        background: #22c55e;
      }
      .sell {
        background: #ef4444;
      }
      .both {
        background: #a855f7;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sina 股票买卖点监控</h1>
    </header>
    <div class="container">
      <div class="controls">
        <label for="days-select">时间范围：</label>
        <select id="days-select">
          <option value="10">近 10 天</option>
          <option value="20" selected>近 20 天</option>
          <option value="30">近 30 天</option>
        </select>
        <span id="range-label"></span>
      </div>

      <div class="card">
        <div id="chart-wrapper">
          <canvas id="signal-chart"></canvas>
        </div>
        <div class="legend">
          <span><i class="dot buy"></i>买点</span>
          <span><i class="dot sell"></i>卖点</span>
          <span><i class="dot both"></i>买卖点</span>
        </div>
      </div>

      <div class="card" style="margin-top: 20px;">
        <h3>最新明细</h3>
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>股票</th>
              <th>买点</th>
              <th>卖点</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <script>
      const ctx = document.getElementById("signal-chart");
      let chartInstance = null;

      function buildChart(data) {
        const stockIndex = new Map(data.stocks.map((stock, idx) => [stock, idx]));
        const points = data.points.map((item) => ({
          x: item.date,
          y: stockIndex.get(item.stock),
          buy: item.buy,
          sell: item.sell,
        }));

        if (chartInstance) {
          chartInstance.destroy();
        }

        chartInstance = new Chart(ctx, {
          type: "scatter",
          data: {
            datasets: [
              {
                label: "买卖点",
                data: points,
                pointRadius: 6,
                pointHoverRadius: 8,
                pointBackgroundColor: (context) => {
                  const { buy, sell } = context.raw;
                  if (buy && sell) return "#a855f7";
                  if (buy) return "#22c55e";
                  if (sell) return "#ef4444";
                  return "#94a3b8";
                },
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: {
                type: "category",
                labels: data.dates,
                title: {
                  display: true,
                  text: "日期",
                },
              },
              y: {
                type: "category",
                labels: data.stocks,
                title: {
                  display: true,
                  text: "股票代码",
                },
              },
            },
            plugins: {
              tooltip: {
                callbacks: {
                  label: (context) => {
                    const { buy, sell } = context.raw;
                    const flags = [];
                    if (buy) flags.push("买点");
                    if (sell) flags.push("卖点");
                    return `${context.label} - ${data.stocks[context.parsed.y]} (${flags.join("/") || "无"})`;
                  },
                },
              },
              legend: {
                display: false,
              },
            },
          },
        });
      }

      function renderTable(data) {
        const body = document.getElementById("table-body");
        body.innerHTML = "";
        data.points.slice(0, 100).forEach((item) => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.date}</td>
            <td>${item.stock}</td>
            <td>${item.buy ? "✓" : "-"}</td>
            <td>${item.sell ? "✓" : "-"}</td>
          `;
          body.appendChild(row);
        });
      }

      async function loadData(days) {
        const response = await fetch(`/api/signals?days=${days}`);
        const data = await response.json();
        if (!response.ok) {
          document.getElementById("range-label").textContent = "(数据库连接失败)";
          console.error(data.error);
          return;
        }
        document.getElementById("range-label").textContent = `(${data.start_date} - ${data.end_date})`;
        buildChart(data);
        renderTable(data);
      }

      document.getElementById("days-select").addEventListener("change", (event) => {
        loadData(event.target.value);
      });

      loadData(20);
    </script>
  </body>
</html>
