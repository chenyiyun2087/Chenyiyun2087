# Chenyiyun2087 生产流水线定义
# 唯一权威来源 — web/app.py worker 读取此文件执行任务
# 更新日期: 2026-08-06

daily_close:
  description: "每日收盘后流水线"
  tasks:
    - id: adc_bs_detect
      time: "21:05"
      script: scoreRank/cli/detect_bs_points.py
      type: script
      trading_day_only: true
      status: enabled

    - id: bs_ocr_adc_compare
      time: "21:10"
      script: scripts/research/compare_bs_sources.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [adc_bs_detect]

    - id: sina_score
      description: "全A股评分"
      time: "21:12"
      script: scoreRank/run_daily.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [adc_bs_detect]

    - id: sina_bs_consensus
      description: "B点综合评分建议"
      time: "21:20"
      script: scoreRank/cli/build_bs_consensus.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [sina_score]

    - id: trusted_strategy_backtest
      time: "22:05"
      script: scripts/ops/run_daily_strategy_backtest.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [sina_bs_consensus]

    - id: rolling_strategy_scorer
      description: "滚动策略评分与权重落库（综合简报数据源，正常成功不单独通知）"
      time: "22:05"
      script: scripts/ops/run_rolling_strategy_scorer.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [trusted_strategy_backtest]

    - id: trusted_strategy_candidates
      description: "可信候选与订单草案落库（综合简报数据源，正常成功不单独通知）"
      time: "22:10"
      script: scripts/ops/export_trusted_strategy_candidates.py
      type: pipeline
      trading_day_only: true
      status: enabled
      depends_on: [sina_bs_consensus, rolling_strategy_scorer]

    - id: trusted_strategy_shadow_monitor
      description: "可信策略影子成交与滑点落库（综合简报数据源，正常成功不单独通知）"
      time: "22:15"
      script: scripts/ops/run_trusted_strategy_shadow_monitor.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [trusted_strategy_candidates]

    - id: trusted_strategy_performance_review
      description: "综合策略简报：收益风险、滚动评分、候选订单与影子成交统一通知"
      time: "22:20"
      script: scripts/ops/run_integrated_strategy_review.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [trusted_strategy_backtest, rolling_strategy_scorer, trusted_strategy_candidates, trusted_strategy_shadow_monitor]

    - id: candle_diag_scan
      time: "21:50"
      script: scripts/ops/run_candle_diag_daily_scan.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [sina_score]

    - id: pit_forward_shadow_collection
      description: "PIT V2 前向证据冻结与技术 Shadow 采集"
      time: "21:55"
      script: scripts/ops/collect_forward_pit_shadow.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: []

    - id: bs_signal_monthly_cycle
      time: "22:00"
      script: scripts/ops/run_monthly_bs_signal_enhancement_cycle.py
      type: script
      trading_day_only: true
      status: enabled

    - id: ops_daily_batch_audit
      description: "日终批量闭环审计（健康日静默，仅异常通知）"
      time: "22:40"
      script: scripts/ops/run_integrated_batch_audit.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [trusted_strategy_shadow_monitor, trusted_strategy_performance_review, candle_diag_scan, pit_forward_shadow_collection]

intraday:
  description: "盘中任务"
  tasks:
    - id: sina_picture
      time: "15:20"
      script: sina/bs_detection/main.py
      type: script
      trading_day_only: true
      status: enabled

    - id: sina_analyse
      time: "16:10"
      script: sina/bs_detection/main.py
      type: script
      trading_day_only: true
      status: enabled

    # v5.3 (2026-08-04): true-forward-blind shadow accumulation for the
    # alpha challengers (config/oos_registry.yaml true_forward_blind).
    # DISABLED 2026-08-04 (v5.4.1 evidence repair): pre-v5.5 shadow is not
    # strategy-equivalent — all challengers share F1 scores, eligible_universe
    # defaults to True, T+1 resolution reads max score date instead of
    # next_open_day, reconcile blocks limit-DOWN instead of limit-UP for buys,
    # and the 15:25 depends_on 16:10 time relation is impossible. The shadow
    # task will be re-enabled only after Forward Shadow Engine v2 (v5.5)
    # passes its full integration test suite. Records produced before the
    # redesign are isolated under exports/forward_shadow_smoke_tests/20260803/
    # and classified PRESTART_PIPELINE_SMOKE_TEST (never shadow evidence).
    - id: daily_vls_scores
      # v5.4.1 DAG fix: was 15:25 depending on sina_analyse at 16:10 —
      # an impossible time relation.  Now post-close at 16:40 (after
      # sina_analyse 16:10 data collection completes).
      time: "16:40"
      script: scripts/ops/compute_daily_vls_scores.py
      type: script
      trading_day_only: true
      status: disabled
      disabled_reason: "v5.4.1 evidence repair: non-equivalent shadow — all challengers share F1 scores; stale-date fallback can duplicate appends. DAG times corrected (16:40 post-close); awaits Shadow Engine v2 (v5.5)"
      depends_on: [sina_analyse]

    - id: alpha_challenger_shadow_record
      time: "17:00"
      script: scripts/ops/run_daily_shadow.py
      args: ["--mode", "record"]
      type: script
      trading_day_only: true
      status: disabled
      disabled_reason: "v5.4.1 evidence repair: shadow not strategy-equivalent; awaits Shadow Engine v2 (v5.5). Record now enforces true-blind start (>= 2026-08-05) and T+1 from trade calendar when re-enabled"
      depends_on: [daily_vls_scores]

    # v5.5 Shadow Engine v2 — daily immutable Signal Package (replaces
    # daily_vls_scores + shadow_record).  One script runs the post-close
    # chain: data quality -> PIT universe freeze -> per-candidate factors
    # -> target portfolios -> SEAL (17:00).
    # ENABLED 2026-08-04, then PAUSED 2026-08-05 (v5.5.1 prestart): the
    # 08-04 SEALED package carries known defects (C3 rank truncation,
    # SCD duplicate symbols, C2 crowding state invalid — circ_mv never
    # in bars so small_vs_large_20d_rs always None, legacy reconcile
    # fallback, factor fillna(0), PIT lineage placeholders).  Tasks stay
    # disabled until v5.5.1 correctness fixes merge and the new
    # true-blind start is formally declared (was 2026-08-05, now
    # NOT_STARTED — 08-04 package is KNOWN_DEFECT_PRESTART_PACKAGE,
    # never counted for E4).
    # RE-ENABLED 2026-08-05 (Phase 5): v5.5.1 + v5.5.2 + v5.6.1 merged to
    # main (PRs #187/#189/#190/#191), remote required CI all green.  The
    # 2026-08-05 17:00 run produces the FIRST formally eligible package;
    # true-blind is re-declared (forward_shadow_v2.yaml) only after the
    # Phase 5 first-day audit (PIT lineage complete, atomic SEALED,
    # precommit idempotent, T+1 fills, position ledger, no legacy
    # fallback) passes.  The 08-04 package stays
    # KNOWN_DEFECT_PRESTART_PACKAGE — never counted for E4.
    - id: alpha_signal_package_seal
      time: "17:00"
      script: scripts/ops/build_daily_alpha_signal_package.py
      type: script
      trading_day_only: true
      status: enabled
      depends_on: [sina_analyse]

morning:
  description: "晨间任务"
  tasks:
    # PERMANENTLY DISABLED: superseded by alpha_signal_execution_reconcile
    # (v5.5 package-path reconcile).  Re-enabling this task would run the
    # legacy reconcile alongside the package-path engine — explicitly
    # forbidden (v5.5.1 removed the legacy auto-fallback; legacy behavior
    # exists only as --mode legacy-reconcile-audit, never scheduled).
    - id: alpha_challenger_shadow_reconcile
      time: "09:35"
      script: scripts/ops/run_daily_shadow.py
      args: ["--mode", "reconcile"]
      type: script
      trading_day_only: true
      status: disabled
      disabled_reason: "PERMANENTLY DISABLED 2026-08-05: superseded by alpha_signal_execution_reconcile — legacy reconcile would double-run the T+1 fill path"

    # v5.5 T+1 morning execution chain (ENABLED 2026-08-04 — integration
    # suite green; PAUSED 2026-08-05 with the seal task — see the
    # alpha_signal_package_seal comment).  Order precommit 09:25 (uses
    # the SEALED package from T day), fill reconcile 09:35 (directional
    # gates via execution_market_rules; live prices from
    # dwd_stock_daily_standard beyond the PIT snapshot end).  NOTE: no
    # depends_on here — the cross-day binding (T-day seal -> T+1 morning)
    # is enforced in-code: precommit/reconcile RAISE shadow_blocked when
    # the SEALED package or orders are missing (fail-closed), matching
    # the existing morning-task pattern.
    - id: alpha_signal_precommit
      time: "09:25"
      script: scripts/ops/run_daily_shadow.py
      args: ["--mode", "precommit"]
      type: script
      trading_day_only: true
      status: enabled  # RE-ENABLED 2026-08-05 — see alpha_signal_package_seal

    - id: alpha_signal_execution_reconcile
      time: "09:35"
      script: scripts/ops/run_daily_shadow.py
      args: ["--mode", "reconcile"]
      type: script
      trading_day_only: true
      status: enabled  # RE-ENABLED 2026-08-05 — see alpha_signal_package_seal

    # v5.5.2 execution loop (REGISTERED but PAUSED): the sell engine and
    # NAV close the execution cycle (hold-expiry exits, rebalance exits,
    # R2 risk reductions, T+1 open fills, per-candidate virtual accounts).
    # Re-enabled together with the v5.5.1 tasks after the full Phase 5
    # checklist (event ledger + state machine + round-trip counting
    # verified in production; true blind re-declared).
    - id: alpha_signal_sell_precommit
      time: "17:00"
      script: scripts/ops/run_daily_shadow.py
      args: ["--mode", "sell-precommit"]
      type: script
      trading_day_only: true
      status: enabled  # RE-ENABLED 2026-08-05 — see alpha_signal_package_seal
      # The sell decision reads the SAME day's sealed package (target
      # portfolios) — run after the seal so the 17:00 pair is ordered.
      depends_on: [alpha_signal_package_seal]

    - id: alpha_signal_nav
      time: "15:30"
      script: scripts/ops/run_daily_shadow.py
      args: ["--mode", "nav"]
      type: script
      trading_day_only: true
      status: enabled  # RE-ENABLED 2026-08-05 — see alpha_signal_package_seal

weekly:
  description: "每周任务"
  tasks:
    - id: sina_bs_image_weekly_cleanup
      time: "22:05"
      day_of_week: 4  # Friday
      script: scripts/ops/cleanup_sina_bs_detection_images.py
      type: script
      status: enabled
