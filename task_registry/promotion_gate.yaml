# Deprecated compatibility view. The source of truth is
# config/production_acceptance.yaml; values here must match it and are checked
# by CI so task consumers cannot silently define a weaker promotion lane.

source_of_truth: config/production_acceptance.yaml

promotion_gate:
  # Walk-forward 晋级条件
  walk_forward:
    min_windows: 3
    min_oos_calmar: 0.5
    min_oos_sharpe: 0.3
    min_hit_rate_5d: 0.40
    require_no_pit_violation: true

  # Shadow 影子盘晋级条件
  shadow:
    disabled_shadow_days: 20
    enabled_shadow_days: 60
    min_trading_days: 80
    min_order_count: 30
    max_execution_degraded_ratio: 0.05
    max_theory_gap: 0.03
    min_pass_rate: 0.80

  # Paper 只用于诊断，不是晋级捷径。
  paper:
    min_trading_days: 30
    min_order_count: 50
    max_slippage_bps: 100
    promotion_eligible: false

  # Canary 小资金实盘晋级条件
  canary:
    enabled: false
    reason: manual_orders_no_broker_integration
    min_trading_days: 60
    min_order_count: 30
    max_drawdown_vs_shadow: 0.02

  # 通用条件
  general:
    require_independent_release_review: true
    require_no_pit_violation: true
    forbid_future_fields: true
