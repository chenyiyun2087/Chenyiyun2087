# Release order policy — immutable governance configuration.
#
# This file defines the CURRENT order authority for production.  The policy
# tier, scale rules, and approved principal are enforced at the order-generation
# boundary (scripts/ops/export_trusted_strategy_candidates.py) and validated by
# runtime/order_policy.py::OrderPolicyGate.
#
# CHANGING approved_principal REQUIRES:
#   1. A new release record in config/strategy_release_registry.yaml
#   2. A manual approval record (audit trail)
#   3. A commit referencing the approval
#
# Do NOT edit this file to temporarily increase capital for a backtest or
# experimental run.

schema_version: "1.0"
current_policy: ACTIVE_FIXED_CAPITAL
scale_policy: NO_EXTERNAL_SCALE
approved_principal: 500000
principal_currency: CNY
approved_at: "2026-07-10T00:00:00+08:00"
approved_by: chenyiyun
require_release_for_principal_change: true
require_manual_approval_for_principal_change: true
allowed_order_sources:
  - trusted_live_snapshot
forbidden_order_sources:
  - cli_override
  - env_var_override
