# Experiment Manifest: Alpha Rebuild 202608 (pre-registered 2026-08-04)
# ======================================================================
# Single manifest tying the 9 challengers to windows, selection rules, and
# hard gates.  The 2025-2026 window is CONSUMED (report-only, NEVER
# selection).  True forward blind starts 2026-08-05 (shadow accumulation,
# min 60 trading days / 30 round trips).
#
# Each challenger file's sha256 below is the PRE-REGISTRATION SHA — the
# freeze-integrity CI check compares current file hashes against these.
# ======================================================================

