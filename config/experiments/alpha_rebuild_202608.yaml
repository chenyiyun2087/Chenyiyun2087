baseline_strategy_id: "vls_mom_contrarian_v1_frozen"

phases:
  - id: factor_ablation
    order: 1
    challengers: [f1_no_value, f2_liquidity_clipped, f3_vol_risk_penalty]
  - id: portfolio_construction
    order: 2
    depends_on: [factor_ablation]
    challengers: [p1_top20_diversified, p2_style_constrained, p3_covariance_sizing]
  - id: portfolio_construction_on_f1
    order: 2b
    depends_on: [factor_ablation]
    rationale: "P-series pre-registered on F2 (rejected); re-run the same
      portfolio layer on the CONFIRMED F1 core with new challenger IDs.
      Limits identical to the original pre-registrations (no loosening)."
    challengers: [f1p1_top20_diversified, f1p2_style_constrained, f1p3_covariance_sizing]
  - id: state_control
    order: 3
    depends_on: [portfolio_construction]
    challengers: [r1_market_regime, r2_crowding_control]
  - id: b_point_sleeve
    order: 4
    challengers: [b_sleeve_independent]
  - id: residual_alpha_v56
    order: 5
    depends_on: [factor_ablation]
    rationale: "v5.6 pre-registration (2026-08-04): risk/weighting-layer
      challengers on the CONFIRMED F1 core.  H010 = residualized F1
      (style-neutral alpha), H011 = F1+R2 crowding weight overlay,
      H012 = F1 risk-weighted sizing (F3 redefinition: volatility affects
      weights only, NEVER ranking).  PRE-REGISTERED only — no run until
      Forward Shadow Phase 1 (E4) completes."
    challengers: [h010_residualized_f1, h011_f1_r2, h012_f1_risk_sized]

