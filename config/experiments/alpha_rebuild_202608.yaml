hard_gates:
  # Challenger screening (research level) — the formal gates continue to
  # follow production_acceptance.yaml / strategy_tournament.yaml.
  min_annualized_return: 0.20
  max_drawdown: -0.32
  min_sharpe: 0.50
  random_permutation_p: 0.10
  hac_t: 1.65
  two_x_cost_alpha_loss_pp: 2.0
  capacity_50w_degradation_pp: 1.0

stopping_and_rejection:
  - "REJECTED_HYPOTHESIS: record as rejected, do NOT re-tune to rescue"
  - "value removal with no IC/return improvement -> reject F1 family"
  - "single-window dependence (2023 OR 2024 alone) -> reject"
  - "random permutation p > 0.10 -> reject"
  - "HAC t < 1.65 -> reject"
  - "2022-class market still beyond -35% drawdown -> reject"
  - "returns fully explained by size/liquidity exposure -> reject"
  - "Top20 return entirely disappears -> reject"
  - "parameter micro-changes collapse results -> reject"
  - "2x cost wipes excess return -> reject"
  - "shadow vs backtest persistent directional bias -> reject"
