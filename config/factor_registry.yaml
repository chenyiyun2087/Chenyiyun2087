schema_version: "1.0"
factors:
  - factor_id: relative_strength
    economic_logic: 中期相对强势可能延续
    formula: 20日收益减截面中位数
    input_fields: [adj_close, trade_date, symbol]
    availability_rule: T日收盘后可见，T+1执行
    frequency: daily
    expected_direction: positive
    normalization: winsorize_1_99_then_zscore
    industry_neutralization: cross_sectional_industry_residual
    missing_value_policy: exclude
    code_sha: e1d287fac1a67b50042384138855a90d9a992954
    research_status: VALIDATED
    production_status: RESEARCH
  - factor_id: trend_persistence
    economic_logic: 稳定趋势比单日跳升更可持续
    formula: 收盘相对MA20与均线斜率组合
