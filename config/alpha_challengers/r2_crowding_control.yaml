# Pre-Registered Alpha Challenger: R2 — Style Crowding Control (2026-08-04)
# ======================================================================
# Hypothesis H008 (style_crowding): extreme small-cap / low-liquidity
# crowding precedes the worst drawdowns (2024 small-cap liquidity shock).
# A leading crowding detector (small-vs-large RS, top-5% turnover
# concentration, micro-cap turnover anomaly, portfolio-hot-stock overlap)
# should reduce size/liquidity exposure BEFORE the crash, not after.
#
# R2 = P2 portfolio + crowding-triggered exposure reduction (not full exit):
#   crowding elevated -> halve size/liquidity exposure, cut single weights
#   crowding extreme  -> reduce total position
#
# PRE-REGISTERED thresholds fixed BEFORE any backtest run.  2025-2026
# CONSUMED (report-only). True forward blind starts 2026-08-05.
# ======================================================================

schema_version: "alpha_challenger_v1"
challenger_id: "r2_crowding_control"
experiment_id: "exp_alpha_rebuild_202608_r2_crowding_control"
hypothesis_id: "H008_style_crowding"
created_at: "2026-08-04"
parameter_source: "PRE_REGISTERED"
data_snapshot_sha: "5ec0962af4a7bff057517a20aa043ef726577409f0379d3cadd5e244c5f469a0"  # release 20260803_oos_v4 content_sha256
selection_window: {start: "2020-04-30", end: "2022-12-31"}
internal_oos_window: {start: "2023-01-01", end: "2023-12-31"}
stress_validation_window: {start: "2024-01-01", end: "2024-12-31"}
untouched_evaluation_window: {start: "2025-01-01", end: "2026-07-31"}  # CONSUMED — report only
true_blind_start: "2026-08-05"
base_strategy: "p2_style_constrained"
change_description: "P2 + leading style-crowding control (size/liquidity exposure reduction on crowding signals)"
hypothesis: "style crowding is a leading indicator of extreme drawdowns; reducing exposure BEFORE the crash beats reacting"
expected_direction: "2024 small-cap shock MDD improves vs P2; size/liquidity attribution share falls"

stopping_criteria:
  - "crowding signals never fire on any historical crowding event (detector inert)"
  - "annualized return degradation > 30% vs P2 on development window"
  - "random permutation p > 0.10 on untouched window"

# Factor definition (F2 weights/signs)
factor_weights:
  size: 0.35
  liquidity: 0.35
  momentum: 0.30
factor_signs:
  size: 1
  liquidity: 1
  momentum: -1

# Score transforms (F2 inherited)
score_transforms:
  liquidity_winsorization:
    method: "clip"
    lower_percentile: 10.0
    upper_percentile: 90.0
  min_20d_turnover_threshold_cny: 3000000.0

# Portfolio construction layer (P2)
portfolio_constraints:
  top_n: 20
  max_total_positions: 20
  single_stock_cap: 0.08
  industry_cap: 0.25
  top2_risk_contribution_cap: 0.45
  target_gross_exposure: 1.00
  exposure_constraints:
    beta_tolerance: 0.20          # |net market-beta rank exposure| <= 0.20
    max_size_exposure: 0.15
    max_liquidity_exposure: 0.15
    max_industry_active_weight: 0.10

# Crowding control layer
crowding_control:
  enabled: true
  indicators:
    - small_vs_large_20d_rs       # small-cap / large-cap 20d relative strength
    - small_vs_large_60d_rs
    - top5_turnover_concentration # top 5% turnover share of market
    - microcap_turnover_anomaly
    - portfolio_hot_stock_overlap # portfolio vs market hot stocks
  response:
    elevated: {size_exposure_scale: 0.5, liquidity_exposure_scale: 0.5, single_weight_scale: 0.7}
    extreme: {total_position_scale: 0.6}
  hysteresis:
    min_hold_days: 5
    cooldown_days: 3

# Execution (TopN=20 via portfolio layer; hold/cost unchanged)
execution:
  top_n: 20
  max_total_positions: 20
  hold_days: 20
  rebalance_score_buffer: 0.10
  rebalance_weight_drift_band: 0.0
  cost_rate: 0.00075
  slippage_bps: 10
  initial_cash: 500000.0

pipeline_stages: [adapter, panel, scores, portfolio_construction, crowding_control, runs, report]
