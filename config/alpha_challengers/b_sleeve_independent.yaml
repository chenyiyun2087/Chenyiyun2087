evaluation_criteria:
  - "independent annualized return reported (not blended)"
  - "daily_return_correlation_with_vls < 0.5"
  - "incremental_sharpe > 0 when combined"
  - "portfolio_mdd_reduction > 0 when combined"
  - "independent_random_permutation_p <= 0.05"
  - "e4_shadow: >= 60 trading days AND >= 30 round trips"

