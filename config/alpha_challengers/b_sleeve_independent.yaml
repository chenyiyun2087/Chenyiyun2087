# Pre-Registered Alpha Challenger: B-Sleeve — B-Point as Independent Alpha Sleeve (2026-08-04)
# ======================================================================
# The B-point RF model (test AUC ~0.679, precision@20 ~0.65) is NOT added
# into the VLS composite score.  It runs as an independent event-driven
# Alpha Sleeve B with its own evaluation:
#
#   - independent annualized return / IC / MDD
#   - daily return correlation with VLS Sleeve A < 0.5
#   - positive incremental Sharpe when combined
#   - independent random permutation p <= 0.05
#   - E4 shadow (>= 60 trading days, >= 30 round trips)
#
# Activation of the model pointer is frozen (auto_activate=false) until the
# validation redo (time-split with purge/embargo, feature drift, lift vs
# bs_score_v2) passes.  PRE-REGISTERED 2026-08-04.
# ======================================================================

