# Pre-Registered Alpha Challenger: P3 — Covariance Risk-Contribution Sizing (2026-08-04)
# ======================================================================
# Hypothesis H006 (risk_budget): equal-weight TopN ignores return covariance;
# risk-contribution-weighted sizing should deliver the same alpha at lower
# portfolio variance.  Objective (pre-registered):
#   maximize expected_alpha - risk_penalty - turnover_penalty - exposure_penalty
#   subject to: alpha retention >= 80%, predicted variance reduction >= 15%,
#   turnover <= baseline * 1.20, NO fallback to equal weight on optimizer failure.
#
# P3 = P2 + covariance-aware weight construction (OrderingMode
# COVARIANCE_RISK_BUDGET in constrained_weights.py).  PRE-REGISTERED.
# 2025-2026 CONSUMED (report-only). True forward blind starts 2026-08-05.
# ======================================================================

schema_version: "alpha_challenger_v1"
challenger_id: "p3_covariance_sizing"
experiment_id: "exp_alpha_rebuild_202608_p3_covariance_sizing"
hypothesis_id: "H006_risk_budget"
created_at: "2026-08-04"
parameter_source: "PRE_REGISTERED"
data_snapshot_sha: "5ec0962af4a7bff057517a20aa043ef726577409f0379d3cadd5e244c5f469a0"  # release 20260803_oos_v4 content_sha256
selection_window: {start: "2020-04-30", end: "2022-12-31"}
internal_oos_window: {start: "2023-01-01", end: "2023-12-31"}
stress_validation_window: {start: "2024-01-01", end: "2024-12-31"}
untouched_evaluation_window: {start: "2025-01-01", end: "2026-07-31"}  # CONSUMED — report only
true_blind_start: "2026-08-05"
base_strategy: "p2_style_constrained"
change_description: "P2 + covariance risk-budget sizing (60d window, 20d halflife, Ledoit-Wolf shrinkage)"
hypothesis: "risk-contribution weighting converts the same alpha into a lower-variance return path than equal-weight TopN"
expected_direction: "portfolio variance falls >= 15%; alpha retention >= 80%; Sharpe improves vs P2"

stopping_criteria:
  - "predicted variance reduction < 15% on development window"
  - "alpha retention < 80% (annualized return loss > 20% vs P2)"
  - "optimizer fails and falls back to equal weight (explicit failure, not silent)"
  - "random permutation p > 0.10 on untouched window"

# Factor definition (F2 weights/signs)
factor_weights:
  size: 0.35
  liquidity: 0.35
  momentum: 0.30
factor_signs:
  size: 1
  liquidity: 1
  momentum: -1

# Score transforms (F2 inherited)
score_transforms:
  liquidity_winsorization:
    method: "clip"
    lower_percentile: 10.0
    upper_percentile: 90.0
  min_20d_turnover_threshold_cny: 3000000.0

# Portfolio construction layer (P2 + covariance sizing)
portfolio_constraints:
  top_n: 20
  max_total_positions: 20
  single_stock_cap: 0.08
  industry_cap: 0.25
  top2_risk_contribution_cap: 0.45
  target_gross_exposure: 1.00
  exposure_constraints:
    beta_tolerance: 0.20          # |net market-beta rank exposure| <= 0.20
    max_size_exposure: 0.15
    max_liquidity_exposure: 0.15
    max_industry_active_weight: 0.10
  covariance_config:
    estimation_window: 60          # trading days
    decay_halflife: 20
    regularization: "ledoit_wolf"
    alpha_retention_floor: 0.80
    predicted_variance_reduction_floor: 0.15
    max_turnover_ratio_vs_baseline: 1.20
    fallback_on_failure: "BLOCK"   # never silently equal-weight

# Execution (TopN=20 via portfolio layer; hold/cost unchanged)
execution:
  top_n: 20
  max_total_positions: 20
  hold_days: 20
  rebalance_score_buffer: 0.10
  rebalance_weight_drift_band: 0.0
  cost_rate: 0.00075
  slippage_bps: 10
  initial_cash: 500000.0

pipeline_stages: [adapter, panel, scores, portfolio_construction, runs, report]
