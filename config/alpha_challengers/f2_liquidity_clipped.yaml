# Pre-Registered Alpha Challenger: F2 — Liquidity Clipped (2026-08-04)
# ======================================================================
# Hypothesis H002 (liquidity_tail_risk): liquidity is the blind-window alpha
# engine (+42.3% single-factor) but its extreme tails drive micro-cap style
# exposure, impact cost, and limit-down exit failure.  Keeping the ranking
# information while winsorizing the extreme percentiles and enforcing a
# minimum 20-day turnover floor should preserve alpha while cutting tail risk.
#
# F2 = F1 + liquidity rank winsorize [10, 90] + min 20d turnover floor.
#
# PRE-REGISTERED: parameters fixed BEFORE any backtest run. 2025-2026 is
# CONSUMED (report-only).  True forward blind starts 2026-08-05.
# ======================================================================

schema_version: "alpha_challenger_v1"
challenger_id: "f2_liquidity_clipped"
experiment_id: "exp_alpha_rebuild_202608_f2_liquidity_clipped"
hypothesis_id: "H002_liquidity_tail_risk"
created_at: "2026-08-04"
parameter_source: "PRE_REGISTERED"
data_snapshot_sha: "5ec0962af4a7bff057517a20aa043ef726577409f0379d3cadd5e244c5f469a0"  # release 20260803_oos_v4 content_sha256
selection_window: {start: "2020-04-30", end: "2022-12-31"}
internal_oos_window: {start: "2023-01-01", end: "2023-12-31"}
stress_validation_window: {start: "2024-01-01", end: "2024-12-31"}
untouched_evaluation_window: {start: "2025-01-01", end: "2026-07-31"}  # CONSUMED — report only
true_blind_start: "2026-08-05"
base_strategy: "f1_no_value"
change_description: "F1 + liquidity rank winsorize to [10,90] percentile + min 20d turnover floor"
hypothesis: "liquidity is effective but extreme exposure tails cause micro-cap risk and exit failure"
expected_direction: "MDD improves vs F1; alpha loss <= 20%; turnover-based eligibility cuts the lowest-liquidity tail"

stopping_criteria:
  - "annualized return degradation > 25% vs F1 on development window"
  - "MDD not improved vs F1 on stress window"
  - "random permutation p > 0.10 on untouched window"
  - "HAC t < 1.65 on untouched window"

# Factor definition (F1 weights/signs)
factor_weights:
  size: 0.35
  liquidity: 0.35
  momentum: 0.30
factor_signs:
  size: 1
  liquidity: 1
  momentum: -1

# Additive score transforms (implemented in build_formal_scores.py)
score_transforms:
  liquidity_winsorization:
    method: "clip"
    lower_percentile: 10.0
    upper_percentile: 90.0
  min_20d_turnover_threshold_cny: 3000000.0   # 3M CNY 20d avg — below is ineligible
  liquidity_consistency_check: true           # Amihud vs turnover vs volume agreement

# Execution (inherited from frozen baseline)
execution:
  top_n: 10
  max_total_positions: 10
  hold_days: 20
  rebalance_score_buffer: 0.10
  rebalance_weight_drift_band: 0.0
  cost_rate: 0.00075
  slippage_bps: 10
  initial_cash: 500000.0

pipeline_stages: [adapter, panel, scores, runs, report]
