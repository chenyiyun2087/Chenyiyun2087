# Pre-Registered Alpha Challenger: P2 — Style Exposure Constraints (2026-08-04)
# ======================================================================
# Hypothesis H005 (style_purity): returns are dominated by size + liquidity
# exposure (2023 alpha entirely size+illiquidity micro-cap premium).  Explicit
# portfolio-level constraints on beta/size/liquidity/industry active weight
# should force the remaining alpha to be genuinely cross-sectional.
#
# P2 = P1 portfolio layer + explicit exposure constraints.  PRE-REGISTERED
# tolerances fixed here BEFORE any backtest run.  2025-2026 CONSUMED
# (report-only). True forward blind starts 2026-08-05.
# ======================================================================

schema_version: "alpha_challenger_v1"
challenger_id: "p2_style_constrained"
experiment_id: "exp_alpha_rebuild_202608_p2_style_constrained"
hypothesis_id: "H005_style_purity"
created_at: "2026-08-04"
parameter_source: "PRE_REGISTERED"
data_snapshot_sha: "5ec0962af4a7bff057517a20aa043ef726577409f0379d3cadd5e244c5f469a0"  # release 20260803_oos_v4 content_sha256
selection_window: {start: "2020-04-30", end: "2022-12-31"}
internal_oos_window: {start: "2023-01-01", end: "2023-12-31"}
stress_validation_window: {start: "2024-01-01", end: "2024-12-31"}
untouched_evaluation_window: {start: "2025-01-01", end: "2026-07-31"}  # CONSUMED — report only
true_blind_start: "2026-08-05"
base_strategy: "p1_top20_diversified"
change_description: "P1 + exposure constraints: |beta - target|<=0.20, |size|<=0.15, |liquidity|<=0.15, industry active <=0.10"
hypothesis: "constraining style exposures yields purer cross-sectional alpha and lower style-crash risk"
expected_direction: "alpha attribution shifts away from size/liquidity; style-crash window (2024 small-cap shock) MDD improves"

stopping_criteria:
  - "annualized return degradation > 30% vs P1 on development window"
  - "style exposure does not materially fall (attribution still size-dominated)"
  - "constraint satisfaction rate < 95% across rebalances"
  - "random permutation p > 0.10 on untouched window"

# Factor definition (F2 weights/signs)
factor_weights:
  size: 0.35
  liquidity: 0.35
  momentum: 0.30
factor_signs:
  size: 1
  liquidity: 1
  momentum: -1

# Score transforms (F2 inherited)
score_transforms:
  liquidity_winsorization:
    method: "clip"
    lower_percentile: 10.0
    upper_percentile: 90.0
  min_20d_turnover_threshold_cny: 3000000.0

# Portfolio construction layer (P1 + exposure constraints)
portfolio_constraints:
  top_n: 20
  max_total_positions: 20
  single_stock_cap: 0.08
  industry_cap: 0.25
  top2_risk_contribution_cap: 0.45
  target_gross_exposure: 1.00
  exposure_constraints:
    beta_tolerance: 0.20          # |net market-beta rank exposure| <= 0.20
                                  # (panel market_beta is a centered rank;
                                  #  the limit bounds the net exposure directly)
    max_size_exposure: 0.15       # |size_exposure| <= 0.15
    max_liquidity_exposure: 0.15  # |liquidity_exposure| <= 0.15
    max_industry_active_weight: 0.10

# Execution (TopN=20 via portfolio layer; hold/cost unchanged)
execution:
  top_n: 20
  max_total_positions: 20
  hold_days: 20
  rebalance_score_buffer: 0.10
  rebalance_weight_drift_band: 0.0
  cost_rate: 0.00075
  slippage_bps: 10
  initial_cash: 500000.0

pipeline_stages: [adapter, panel, scores, portfolio_construction, runs, report]
