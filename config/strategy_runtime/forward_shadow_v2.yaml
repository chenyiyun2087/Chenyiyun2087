# Forward Shadow Engine v2 — Strategy Runtime Definitions (v5.5)
# ======================================================================
# Each candidate is a COMPLETE strategy: its own factor pipeline,
# eligibility universe, score transform, portfolio constructor, risk
# overlay, and execution policy.  Candidates never share another
# candidate's scores (the pre-v5.5 shadow copied F1 scores to every
# challenger — that defect is why the shadow was rebuilt).
#
# Active set (reduced from 12): C0 baseline control, C1 F1 Top10,
# C2 F1+R2 crowding, C3 residualized F1, RND random diagnostic.
# F2/F3/P1/P2/P3/R1/B-sleeve are PAUSED from forward shadow until their
# research completeness gates pass (v5.4.1 plan section 六).
#
# Pre-registration: C0/C1/C2/C3 challenger configs are sealed by
# config/formal_seals/alpha_rebuild_202608_seal.json (C1=f1_no_value,
# C2=h011_f1_r2, C3=h010_residualized_f1 — v5.6 pre-registered
# 2026-08-04).  RND is a diagnostic transform only, never a candidate.
# ======================================================================

schema_version: "strategy_runtime_v1"
shadow_id: "forward_shadow_v2"
# v5.5.1 prestart (2026-08-05): the 2026-08-05 true-blind start was
# WITHDRAWN.  The 08-04 SEALED package carries known defects (C3 rank
# truncation, SCD duplicate symbols, C2 crowding state invalid — circ_mv
# never in bars, legacy reconcile fallback, factor fillna(0), PIT lineage
# placeholders) and is classified KNOWN_DEFECT_PRESTART_PACKAGE — never
# consumed for execution, never counted for E4.  Its corrected
# revision_2/ (v5.5.1 code, 2026-08-05) is engineering comparison only.
#
# Phase 5 re-declaration (2026-08-05): v5.5.1 + v5.5.2 + v5.6.1 merged to
# main (PRs #187/#189/#190/#191), remote required CI all green, tasks
# re-enabled in task_registry/pipeline.yaml.  The 2026-08-05 17:00 run
# is the FIRST FORMALLY ELIGIBLE signal package; true_blind_start is
# written here ONLY after the first-day audit passes (PIT lineage
# complete, atomic SEALED, precommit idempotent, T+1 fills, position
# ledger, no legacy fallback).
forward_shadow_status: ENABLED_AWAITING_FIRST_PACKAGE
true_blind_start: null
true_blind_status: NOT_STARTED
capital_authority: false
allowed_new_capital_cny: 0
signal_time: "T15:30:00+08:00"
execution_time: "T+1 09:30:00+08:00"

# v5.5.1 strategy contract: the universe excludes ST, new stocks (60d),
# delisting-period names, and suspended names.  Each flag MUST have a
# reliable status source (label table / LISTED transitions); a missing
# source BLOCKS the package — never default-normal.
universe_contract:
  exclude_st: true
  exclude_new_stock_days: 60
  exclude_delisting_period: true
  exclude_suspended: true

candidates:
  C0:
    challenger_id: "baseline_vls_frozen"
    role: "BASELINE_CONTROL"
    strategy_def: "config/strategy_definitions/vls_mom_contrarian_v1_frozen.yaml"
    factor_pipeline: "vls_frozen"
    factor_weights: {value: 0.30, size: 0.25, liquidity: 0.25, momentum: 0.20}
    factor_signs: {value: 1, size: 1, liquidity: 1, momentum: -1}
    eligibility_pipeline: "pit_universe"
    score_transform: "identity"
    portfolio_constructor: "equal_weight_top_n"
    top_n: 10
    max_missing_factor_pct: 0.05  # v5.5.1 contract gate — any-required-factor-missing rows are NaN (never imputed 0) and must stay under this rate
    risk_overlay: "none"
    execution_policy: "ashare_t1_directional"
    # v5.5.2 execution contract (inherited from the frozen baseline —
    # identical for every candidate so comparisons are execution-fair).
    execution:
      hold_days: 20
      rebalance_score_buffer: 0.10
      weight_drift_band: 0.0
      cost_rate: 0.00075
      slippage_bps: 10
      initial_cash_cny: 500000

  C1:
    challenger_id: "f1_no_value"
    role: "FORWARD_CANDIDATE"
    strategy_def: "config/alpha_challengers/f1_no_value.yaml"
    factor_pipeline: "f1"
    factor_weights: {size: 0.35, liquidity: 0.35, momentum: 0.30}
    factor_signs: {size: 1, liquidity: 1, momentum: -1}
    eligibility_pipeline: "pit_universe"
    score_transform: "identity"
    portfolio_constructor: "equal_weight_top_n"
    top_n: 10
    max_missing_factor_pct: 0.05  # v5.5.1 contract gate — any-required-factor-missing rows are NaN (never imputed 0) and must stay under this rate
    risk_overlay: "none"
    execution_policy: "ashare_t1_directional"
    # v5.5.2 execution contract (identical across candidates).
    execution:
      hold_days: 20
      rebalance_score_buffer: 0.10
      weight_drift_band: 0.0
      cost_rate: 0.00075
      slippage_bps: 10
      initial_cash_cny: 500000

  C2:
    challenger_id: "h011_f1_r2"
    role: "FORWARD_CANDIDATE"
    strategy_def: "config/alpha_challengers/h011_f1_r2.yaml"
    factor_pipeline: "f1"
    factor_weights: {size: 0.35, liquidity: 0.35, momentum: 0.30}
    factor_signs: {size: 1, liquidity: 1, momentum: -1}
    eligibility_pipeline: "pit_universe"
    score_transform: "identity"
    portfolio_constructor: "equal_weight_top_n"
    top_n: 10
    max_missing_factor_pct: 0.05  # v5.5.1 contract gate — any-required-factor-missing rows are NaN (never imputed 0) and must stay under this rate
    risk_overlay: "r2_crowding"     # weight scaler — never changes selection
    execution_policy: "ashare_t1_directional"
    # v5.5.2 execution contract (identical across candidates).
    execution:
      hold_days: 20
      rebalance_score_buffer: 0.10
      weight_drift_band: 0.0
      cost_rate: 0.00075
      slippage_bps: 10
      initial_cash_cny: 500000

  C3:
    challenger_id: "h010_residualized_f1"
    role: "FORWARD_CANDIDATE"
    strategy_def: "config/alpha_challengers/h010_residualized_f1.yaml"
    factor_pipeline: "f1"
    factor_weights: {size: 0.35, liquidity: 0.35, momentum: 0.30}
    factor_signs: {size: 1, liquidity: 1, momentum: -1}
    eligibility_pipeline: "pit_universe"
    score_transform: "residualize_on_style"
    residualization:
      style_factors: [size, liquidity, market_beta]
      industry_fixed_effects: true
      minimum_cross_section: 20
    portfolio_constructor: "equal_weight_top_n"
    top_n: 10
    max_missing_factor_pct: 0.05  # v5.5.1 contract gate — any-required-factor-missing rows are NaN (never imputed 0) and must stay under this rate
    risk_overlay: "none"
    execution_policy: "ashare_t1_directional"
    # v5.5.2 execution contract (identical across candidates).
    execution:
      hold_days: 20
      rebalance_score_buffer: 0.10
      weight_drift_band: 0.0
      cost_rate: 0.00075
      slippage_bps: 10
      initial_cash_cny: 500000

  RND:
    challenger_id: "random_control"
    role: "DIAGNOSTIC_ONLY"
    strategy_def: null
    factor_pipeline: "f1"           # same universe, same factor inputs
    eligibility_pipeline: "pit_universe"
    score_transform: "random_seeded"
    random_seed_base: 20260805
    portfolio_constructor: "equal_weight_top_n"
    top_n: 10
    max_missing_factor_pct: 0.05  # v5.5.1 contract gate — any-required-factor-missing rows are NaN (never imputed 0) and must stay under this rate
    risk_overlay: "none"
    execution_policy: "ashare_t1_directional"
    # v5.5.2 execution contract — RND uses identical execution conditions
    # to the candidates (same cost model, same cash) so the control is
    # execution-fair.
    execution:
      hold_days: 20
      rebalance_score_buffer: 0.10
      weight_drift_band: 0.0
      cost_rate: 0.00075
      slippage_bps: 10
      initial_cash_cny: 500000
