# Production acceptance criteria — governs promotion through all deployment lanes.
#
# L0 Research → L1 Manual Production → L2 Enabled Shadow → L3 Canary
# → L4 Controlled Scale → L5 Stable Production
#
# Every gate below must pass before advancing to the next lane.

acceptance:
  # Canonical account/reporting currency.  Rendering layers must use an
  # explicit CNY label instead of a locale-dependent generic currency format.
  account_currency: CNY

  # -----------------------------------------------------------------------
  # Versioned research validation profiles
  # -----------------------------------------------------------------------
  validation_profiles:
    alpha_v4_7: &alpha_v4_7
      schema_version: "alpha_v3_acceptance_v1"
      evidence_version: "alpha_v4_7_pit_data_adapter_v1"
      core_period:
        min_start_date: "2018-01-01"
        end_date_policy: "latest_complete_trading_day"
        legacy_extension_start_date: "2013-01-01"
        legacy_extension_required: false
        min_trade_day_coverage: 0.98
      benchmarks:
        primary: "000300.SH"
        secondary: "000905.SH"
        required:
          - "000300.SH"
          - "000905.SH"
          - "000852.SH"
        require_point_in_time_series: true
      alpha_proof:
        schema_version: "alpha_v4_0_proof_v1"
        min_aligned_trading_days: 252
        min_daily_coverage: 0.95
        require_full_rank_regression: true
        residual_label: "regression_alpha"
        market_regime_factor: "market_regime"
        benchmark_gate_policy: "primary_excess_and_all_required_complete"
        require_timezone_aware_availability: true
        timezone: "Asia/Shanghai"
        unexplained_variance_warning_ratio: 0.05
        max_unexplained_variance_ratio: 0.10
        min_alpha_tstat: 2.00
        stability_years: [2023, 2024, 2025, 2026]
        min_stability_year_trading_days: 126
        min_stability_year_months: 9
        min_valid_stability_years: 3
        min_positive_alpha_year_ratio: 0.60
        max_single_positive_year_alpha_contribution: 0.60
        worst_year_alpha_floor: -0.10
        stock_selection_requires_independent_evidence: true
        require_factor_source_manifest: true
        require_factor_compute_manifest: true
        require_factor_semantic_definition: true
        require_environment_lock_hash: true
      replay_audit:
        require_exact_input_snapshot: true
        require_exact_nav_sha: true
        require_exact_trade_sha: true
        require_exact_attribution_sha: true
        require_exact_risk_sha: true
        require_structured_replay_diff: true
        replay_diff_max_rows: 100
        require_environment_fingerprint: true
        require_runtime_determinism_manifest: true
        require_replay_diff_severity: true
        correctness_sample_size: 100
        correctness_sampling_policy: "DETERMINISTIC_STRATIFIED"
        annual_anchor_days_per_year: 10
        event_sampling_policy: "EVENT_STRATIFIED_PLUS_ANNUAL_ANCHORS"
        event_sample_quotas:
          ST_CHANGE: 20
          SUSPENSION_RESUMPTION: 20
          PRICE_LIMIT: 20
          DELISTING: 10
          ORDINARY: 30
        portfolio_state_weight_tolerance: 0.000001
        portfolio_accounting_tolerance_cny: 0.01
        require_research_production_contract: true
        require_correctness_gap_report: true
        require_correctness_synthetic_suite: true
        require_dependency_graph_v2: true
        require_engineering_readiness_score: true
        require_event_correctness_coverage: true
        require_portfolio_state_audit: true
        require_evidence_contract_matrix: true
        require_evidence_issue_tracker: true
        require_capital_gate_simulator: true
        require_investment_readiness_report: true
        require_evidence_strength_report: true
        require_capital_decision_firewall: true
        require_evidence_promotion_workflow: true
        require_alpha_claim_registry: true
        require_portfolio_accounting_reconciliation: true
        require_failure_coverage_matrix: true
        evidence_strength_levels:
          E0: "missing_or_blocked"
          E1: "code_test_or_replay"
          E2: "simulation_or_paper"
          E3: "release_scoped_historical_real_data"
          E4: "release_scoped_live_or_shadow_trading"
        capital_minimum_evidence_level: "E3"
        shadow_minimum_evidence_level: "E4"
        require_evidence_expiration: true
        require_capital_tier_engine: true
        require_claim_lifecycle: true
        require_strategy_health_monitor: true
        require_independent_reviewer_simulation: true
        runtime_determinism:
          random_seed: 2087
          numpy_seed: 2087
          python_hash_seed: "0"
          thread_count: 1
          locale: "C.UTF-8"
          require_cpu_fingerprint: true
          require_kernel_version: true
          require_filesystem_encoding: true
          record_container_image_digest: true
          record_dependency_lock_sha256: true
        required_failure_injections:
          - factor_pipeline_hash_mismatch
          - factor_timezone_missing
          - factor_available_after_signal
          - benchmark_end_date_mismatch
          - input_snapshot_sha_mismatch
          - corporate_action_lookahead
          - t_day_execution_violation
          - portfolio_weight_lookahead
          - financial_announcement_lookahead
          - suspended_security_fill
          - limit_queue_impossible_fill
          - delisting_survivorship_bias
          - adjustment_factor_future_leak
          - universe_survivorship_bias
          - financial_revision_after_release
          - duplicate_timestamp_order
          - auction_price_leak
          - order_queue_priority_leak
          - provider_semantic_change
          - numeric_precision_drift
      performance:
        research_target_annualized_return: 0.30
        min_annualized_return: 0.25
        min_annualized_excess_return: 0.15
        max_drawdown: -0.25
        min_sharpe_ratio: 1.00
      factor_ic:
        horizons: [5, 10, 20, 60]
        min_mean_rank_ic: 0.02
        min_information_ratio: 0.30
        research_disable_below_mean_rank_ic: 0.01
        min_coverage: 0.95
      economic_alpha_qualification:
        min_trading_days: 252
        target_trading_days: 504
        min_market_regimes: 3
        min_universe_coverage: 0.95
        min_median_rank_ic: 0.00
        min_information_ratio: 0.50
        require_formal_pit: true
        require_industry_neutralization: true
        require_top_bottom_portfolio_evidence: true
        require_t_plus_1_factor_ledger: true
        require_cost_adjusted_net_return: true
        require_time_holdout: true
        require_factor_overlap_matrix: true
        short_leg_requires_borrow_evidence: true
        require_release_scoped_pit_source_manifest: true
        require_complete_universe_status: true
        require_pit_data_adapter: true
        require_financial_revision_chain: true
        require_corporate_action_semantics: true
        require_security_lifecycle_transition: true
        require_field_definition_hash: true
        synthetic_evidence_levels: ["S0", "S1", "S2", "S3"]
        synthetic_evidence_cannot_satisfy_historical_gate: true
        diagnostic_evidence_authorizes_production: false
      attribution:
        closure_tolerance: 0.000001
        required_factors:
          - market_beta
          - size
          - volatility
          - liquidity
          - industry
          - momentum
          - value
          - market_regime
      stress:
        initial_capital_cny: 500000
        capacity_account_sizes_cny: [50000, 100000, 500000, 1000000, 5000000]
        cost_multipliers: [1.0, 2.0]
        slippage_bps: [20, 50, 100]
        universe_drop_ratios: [0.10, 0.20]
        universe_drop_seeds: [1103, 2087, 3141, 4099, 7919]
      regime_attribution:
        required_states: ["FREEZE", "RISK_OFF", "NEUTRAL", "RISK_ON", "BROAD_RISK_ON"]
        min_aligned_trading_days_per_state: 63
      execution:
        signal_timing: "T_CLOSE"
        fill_timing: "T_PLUS_1_OPEN"
        require_limit_up_down_handling: true
        require_unfilled_position_freeze: true
        stress_scenarios:
          - "limit_up_buy_blocked"
          - "limit_down_sell_blocked"
          - "one_day_fill_delay"
          - "slippage_2x"
        min_execution_stress_score: 80
        stress_evidence_layer: "SIMULATION"
        execution_evidence_layers: ["SIMULATION", "PAPER", "LIVE"]
      capital_readiness_simulation:
        evidence_ttl_days:
          E0: 0
          E1: 30
          E2: 30
          E3: 180
          E4: 30
        volatility_warning_ratio: 1.50
        turnover_zscore_warning: 3.00
        tiers:
          - tier: "T0"
            label: "RESEARCH_ONLY"
            capital_cny: 0
            required_gates: []
            required_levels: {}
          - tier: "T1"
            label: "PAPER"
            capital_cny: 0
            required_gates:
              - "research_replay"
              - "replay_diff"
              - "correctness_synthetic_suite"
              - "failure_injection"
              - "execution_simulation"
            required_levels:
              research_replay: "E1"
              replay_diff: "E1"
              correctness_synthetic_suite: "E1"
              failure_injection: "E1"
              execution_simulation: "E2"
          - tier: "T2"
            label: "CANARY_50000"
            capital_cny: 50000
            required_gates:
              - "core_history"
              - "benchmark_excess"
              - "alpha_attribution"
              - "factor_ic"
              - "alpha_proof_guard"
              - "factor_compute_lineage"
              - "walk_forward"
              - "execution_cost_stress"
              - "economic_shadow"
              - "manual_approval"
            required_levels:
              core_history: "E3"
              benchmark_excess: "E3"
              alpha_attribution: "E3"
              factor_ic: "E3"
              alpha_proof_guard: "E3"
              factor_compute_lineage: "E3"
              walk_forward: "E3"
              execution_cost_stress: "E3"
              economic_shadow: "E4"
          - tier: "T3"
            label: "CONTROLLED_SCALE_500000"
            capital_cny: 500000
            required_gates:
              - "manual_canary_live"
              - "economic_shadow"
              - "manual_approval"
            required_levels:
              manual_canary_live: "E4"
              economic_shadow: "E4"
          - tier: "T4"
            label: "EXPANDED_SCALE"
            capital_cny: 1000000
            required_gates:
              - "scaled_live_operation"
              - "manual_canary_live"
              - "manual_approval"
            required_levels:
              scaled_live_operation: "E4"
              manual_canary_live: "E4"
      evidence_acquisition:
        schema_version: "alpha_v4_1_acquisition_v1"
        discovery_patterns:
          benchmark:
            - "exports/signal_research/**/*benchmark*.csv"
          factor:
            - "data/processed/bs_training_dataset*.parquet"
          pit:
            - "exports/pit_forward/runs/**/*.json"
        max_candidates_per_kind: 25
        snapshot_copy_max_bytes: 536870912
        required_benchmark_codes:
          - "000300.SH"
          - "000905.SH"
          - "000852.SH"
        benchmark_min_coverage: 0.95
        benchmark_min_aligned_days: 252
        factor_min_coverage: 0.95
        require_timezone_aware_availability: true
        require_release_strategy_match: true
        forbid_backfilled_model_fields_without_pit: true
        refresh_priorities:
          benchmark: 1
          factor: 2
          pit: 3
          shadow: 4
      evidence_production:
        schema_version: "alpha_v4_2_production_v1"
        benchmark_provider: "tencent_public_index_kline"
        benchmark_provider_endpoint: "https://web.ifzq.gtimg.cn/appstock/app/kline/kline"
        benchmark_available_time: "16:00:00+08:00"
        benchmark_start_date: "2018-01-01"
        request_timeout_seconds: 20
        required_output_columns:
          - "benchmark"
          - "trade_date"
          - "nav"
          - "available_at"
          - "close"
          - "source"
          - "source_sha256"
          - "release_id"
          - "strategy_id"
        factor_builder_requires_formal_pit: true
        pit_minimum_components:
          - "listing_lifecycle"
          - "st_status"
          - "suspension"
          - "financial_announcement_time"
      promotion:
        require_formal_pit: true
        require_walk_forward: true
        require_factor_attribution: true
        require_factor_ic: true
        require_execution_stress: true
        research_pass_does_not_authorize_capital: true
    # ── Formal Evidence Backbone v5.0 ──
    # Historical profiles are frozen in config/validation_profiles/.
    # Each profile is an independent, immutable YAML file.
    # New validation runs use the active alpha_v3_2 Proof Guard profile;
    # formal_v5_0 remains available for historical replay compatibility.
    # Historical replays must use the EXACT profile version from that era.
    formal_v5_0: *alpha_v4_7
    # ── Active v3.2 Proof Guard profile ──
    # This top-level copy is consumed by production-readiness evaluators;
    # runtime/research modules load the same versioned contract from
    # config/validation_profiles/alpha_v3_2.yaml.
    alpha_v3_2:
      <<: *alpha_v4_7
      schema_version: "alpha_v3_2_acceptance_v1"
      evidence_version: "alpha_v3_2_evidence_v1"
      core_period:
        min_start_date: "2018-01-01"
        end_date_policy: "latest_complete_trading_day"
        legacy_extension_start_date: "2013-01-01"
        legacy_extension_required: false
        min_trade_day_coverage: 0.98
      benchmarks:
        primary: "000300.SH"
        secondary: "000905.SH"
        required: ["000300.SH", "000905.SH", "000852.SH"]
        require_point_in_time_series: true
      alpha_proof:
        schema_version: "alpha_v3_2_proof_guard_v1"
        min_aligned_trading_days: 252
        min_daily_coverage: 0.95
        require_full_rank_regression: true
        residual_label: "regression_alpha"
        benchmark_gate_policy: "primary_excess_and_all_required_complete"
        require_timezone_aware_availability: true
        timezone: "Asia/Shanghai"
        unexplained_variance_warning_ratio: 0.05
        max_unexplained_variance_ratio: 0.05
        min_alpha_tstat: 2.0
        stability_years: [2023, 2024, 2025, 2026]
        min_stability_year_trading_days: 126
        min_stability_year_months: 9
        min_valid_stability_years: 3
        min_positive_alpha_year_ratio: 0.60
        max_single_positive_year_alpha_contribution: 0.60
        stock_selection_requires_independent_evidence: true
      performance:
        research_target_annualized_return: 0.30
        min_annualized_return: 0.25
        min_annualized_excess_return: 0.15
        max_drawdown: -0.25
        min_sharpe_ratio: 1.00
      factor_ic:
        horizons: [5, 10, 20]
        min_mean_rank_ic: 0.02
        min_information_ratio: 0.30
        research_disable_below_mean_rank_ic: 0.01
        min_coverage: 0.95
      promotion:
        require_formal_pit: true
        require_walk_forward: true
        require_factor_attribution: true
        require_factor_ic: true
        require_execution_stress: true
        research_pass_does_not_authorize_capital: true
    # ── End versioned profiles ──

  # -----------------------------------------------------------------------
  # L0→L1: Research → Manual Production
  # -----------------------------------------------------------------------
  release:
    require_git_commit_sha: true
    require_config_sha: true
    require_data_snapshot_hash: true
    require_feature_schema_version: true
    require_deterministic_replay: true
    max_unrecorded_manual_override_count: 0

  # -----------------------------------------------------------------------
  # Strict ledger & corporate actions (highest priority)
  # -----------------------------------------------------------------------
  strict_ledger:
    required_status: VERIFIED                          # currently: PARTIAL_UNVERIFIED
    min_corporate_action_coverage: 1.00                # 100% of held stocks must have CA data
    max_t_plus_1_fill_violations: 0
    max_order_conservation_errors: 0
    max_ledger_nav_error_bps: 1
    max_unexplained_cash_residual_pct_nav: 0.0025      # ≤ 0.25% NAV
    max_rounding_cash_residual_pct_target_gross: 0.02  # ≤ 2% of target gross
    max_unexplained_position_mismatch_count: 0
    # Rounding tolerance: max(25bp, 0.5 * lot_notional / NAV)
    rounding_tolerance_formula: "max(0.0025, 0.5 * single_lot_notional / account_nav)"

  # -----------------------------------------------------------------------
  # Full history backtest (2013–present)
  # -----------------------------------------------------------------------
  full_history:
    min_start_date: "2013-01-01"
    min_trade_day_coverage: 0.98
    max_future_data_violations: 0
    max_drawdown: -0.35
    min_annualized_return: 0.00
    max_single_year_profit_contribution: 0.60
    require_market_regime_reports: true
    required_regimes:
      - "2015 bull + deleveraging"
      - "2016-2018 bear + style rotation"
      - "2020 extreme volatility"
      - "2021 sector concentration"
      - "2022 growth compression"
      - "2023-2024 micro-cap + quant crowding"
      - "2025-2026 current regime"
    unacceptable_coverage_gaps: []

  # -----------------------------------------------------------------------
  # Rolling OOS (walk-forward)
  # -----------------------------------------------------------------------
  rolling_oos:
    train_months: 12
    validation_months: 3
    test_months: 3
    step_months: 3
    purge_trading_days: 10
    embargo_trading_days: 5
    min_oos_window_coverage: 1.00
    min_positive_window_ratio: 0.60
    min_oos_calmar: 0.25
    max_oos_drawdown: -0.35
    max_single_window_profit_contribution: 0.35
    # Challenger must beat baseline by at least 10% on Calmar
    challenger_min_calmar_improvement_pct: 10
    min_random_baseline_win_ratio: 0.70
    min_reverse_baseline_win_ratio: 0.70

  # -----------------------------------------------------------------------
  # Statistical robustness
  # -----------------------------------------------------------------------
  statistical_robustness:
    min_deflated_sharpe_confidence: 0.95
    max_probability_of_backtest_overfitting: 0.20
    require_block_bootstrap: true
    require_factor_attribution: true
    max_single_stock_profit_contribution: 0.15
    max_single_industry_profit_contribution: 0.35
    max_single_month_profit_contribution: 0.20
    bootstrap_annual_return_5th_percentile_min: 0.00   # must not be significantly negative
    bootstrap_max_dd_95th_percentile_max: -0.40
    required_attribution_factors:
      - market_beta
      - size
      - volatility
      - liquidity
      - industry
      - momentum
      - value

  # -----------------------------------------------------------------------
  # Cost, slippage & capacity stress
  # -----------------------------------------------------------------------
  execution:
    account_sizes: [500000, 1500000, 3000000, 5000000, 10000000]
    scenarios:
      - {id: "BASE_7P5_10", cost_rate: 0.00075, slippage_bps: 10, adv_limit_type: "base"}
      - {id: "CONSERVATIVE_15_25", cost_rate: 0.0015, slippage_bps: 25, adv_limit_type: "stress"}
      - {id: "CONSERVATIVE_15_50", cost_rate: 0.0015, slippage_bps: 50, adv_limit_type: "stress"}
      - {id: "EXTREME_30_100", cost_rate: 0.0030, slippage_bps: 100, adv_limit_type: "stress"}
      - {id: "EXTREME_50_100", cost_rate: 0.0050, slippage_bps: 100, adv_limit_type: "stress"}
    max_single_order_adv_ratio_base: 0.01                # 1% of 20-day ADV
    max_single_order_adv_ratio_stress: 0.03              # 3%
    max_expected_impact_bps_p95: 50
    max_unfilled_order_ratio_base: 0.03
    max_unfilled_order_ratio_stress: 0.08
    require_intraday_or_auction_data_for_post_open_logic: true
    hard_blocks:
      - "abs(open_gap_proxy) > 5%"
      - "limit_up_or_down_ratio > 20%"
      - "expected_impact > 3% ADV"
    stress_max_dd_widening_base: 0.08                    # DD can widen 8 pct in stress
    stress_max_dd_widening_extreme: 0.15                 # DD can widen 15 pct in extreme
    max_realized_slippage_bps: 50                        # PR-H1: max realized slippage in bps (base)
    max_realized_slippage_bps_stress: 150                # PR-H1: max realized slippage in bps (stress)
    max_turnover_ratio: 50                               # PR-H1: max turnover
    max_partial_fill_ratio: 0.05                         # PR-H1: max 5% partial fills
    max_delayed_fill_ratio: 0.05                         # PR-H1: max 5% delayed fills
    max_fill_latency_seconds: 300                        # PR-H1: max seconds from submission to first fill

  # -----------------------------------------------------------------------
  # L1→L2: Shadow
  # -----------------------------------------------------------------------
  enabled_shadow:
    # Entry to SHADOW_ENABLED requires a completed disabled-shadow lane.
    lane: "SHADOW_DISABLED_TO_ENABLED"
    min_real_trading_days: 20
    min_recovery_event_days: 5
    min_cumulative_recovery_events: 30
    min_positive_event_rate: 0.55
    max_event_degraded_ratio: 0.05
    max_incremental_hard_block_days: 0
    max_execution_proxy_missing_days: 0
    max_consecutive_negative_theory_gap_days: 2
    max_bad_shadow_days_before_block: 3
    require_manual_approval: true

  # -----------------------------------------------------------------------
  # L2: Economic shadow (starts only after the 20-day technical shadow)
  # -----------------------------------------------------------------------
  economic_shadow:
    lane: "TECHNICAL_SHADOW_TO_ECONOMIC_SHADOW"
    min_real_trading_days: 60
    min_completed_round_trips: 30
    max_reconciliation_errors: 0
    require_cost_after_alpha_positive: true
    require_shadow_theory_gap_validation: true
    require_manual_approval: true

  # L3: Manual canary.  The system never submits or cancels broker orders.
  manual_canary:
    lane: "ECONOMIC_SHADOW_TO_MANUAL_CANARY"
    max_capital_ratio: 0.10                              # 5-10% of target capital
    min_capital_cny: 50000
    max_capital_cny: 100000
    min_real_trading_days: 40
    require_daily_offline_account_reconciliation: true
    broker_api_enabled: false
    max_reconciliation_errors: 0
    max_unexplained_cash_difference: 0.01                # 0.01 CNY or explainable rounding
    max_realized_slippage_outlier_ratio: 0.05            # ≤ 5% of fills above P95 model
    max_realized_cost_2x_model_ratio: 0.05               # ≤ 5% of fills cost > 2x model
    max_unfilled_order_errors: 0
    max_risk_governor_false_negative: 0                  # should have frozen but didn't
    canary_max_dd_vs_oos_band: "within 95% CI"
    require_manual_approval: true

  # -----------------------------------------------------------------------
  # L4: Scale-up (50万恢复审批后；100-150万至少连续120日实盘证据)
  # -----------------------------------------------------------------------
  scale_up:
    stages: [0.10, 0.25, 0.50, 1.00]                    # capital ratio stages
    min_days_per_stage: 60
    min_live_days_for_1m_to_1_5m: 120
    min_round_trips_per_stage: 30
    max_reconciliation_errors: 0
    max_hard_execution_errors: 0
    max_unexplained_deviation: 0
    require_manual_approval: true

  # -----------------------------------------------------------------------
  # Production risk controls (portfolio-level)
  # -----------------------------------------------------------------------
  portfolio_risk_controls:
    current_approved_total_exposure_pct_nav: 50
    system_hard_max_total_exposure_pct_nav: 85
    champion_default_exposure_pct_nav: 50
    max_single_position_weight_pct_nav: 15
    max_single_industry_weight_pct_nav: 30
    max_correlated_theme_weight_pct_nav: 40
    max_top2_risk_contribution_pct: 45
    max_daily_new_position_pct_nav: 30
    max_daily_turnover_pct_nav: 50
    max_single_order_adv_ratio: 0.01
    max_attack_pool_budget_share_pct: 35
    auto_hold_cash_on_unfilled_buy: true
    ban_new_high_risk_on_consecutive_sell_failure: true
    ban_full_position_in_single_market_regime: true
    data_yellow_ban_new_high_risk: true
    data_red_sell_and_maintain_only: true

  # Account-level circuit breakers
  account_circuit_breakers:
    loss_5d_pct: -0.08                                   # → ban position increase + manual review
    drawdown_20d_pct: -0.15                              # → reduce to defensive
    drawdown_peak_pct: -0.25                             # → freeze new buys + incident review
    drawdown_peak_pct_hard: -0.30                        # → stop strategy + full post-mortem
    data_delay_consecutive_days: 3                       # → freeze new buys
    execution_deviation_consecutive_days: 2               # → freeze new buys
