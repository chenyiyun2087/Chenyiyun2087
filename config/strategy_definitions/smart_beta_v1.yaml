config_hash: a23a31a7a245b5586cf1c6495e29e35d19752188e52b1c80dc8d3cf2b3dff733
sample_policy:
  status: CONSUMED_DEVELOPMENT_SAMPLE
  start: "2022-01-01"
  end: "2026-08-09"
  selection_allowed: false
  independent_oos: false
  reporting: DIAGNOSTIC_ONLY
promotion_status: BLOCKED
capital_cny: 0.0
