sample_policy:
  status: CONSUMED_DEVELOPMENT_SAMPLE
  start: "2022-01-01"
  end: "2026-08-09"
  selection_allowed: false
  independent_oos: false
  reporting: DIAGNOSTIC_ONLY
promotion_status: BLOCKED
capital_cny: 0.0
