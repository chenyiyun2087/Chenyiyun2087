production:
  primary_strategy: production_governed_vol_position
  primary_selection_strategy: baseline_full_liquidity_detail_vol_position
  risk_profile: adaptive
  position_ratio: 0.70
  top_n: 5
  max_total_positions: 5
  hold_days: 10
  execution_mode: t_plus_1_open
  shadow_risk_strategy: adaptive_market_style
  shadow_version: v2.2
  research_shadow_candidate:
    enabled: false
    strategy: production_governed_vol_position_v1_2b_gate_tuned
    compare_to: production_governed_vol_position
    min_shadow_days: 20
  ashare_supplement_limit: 2
  allow_model_risk_fields: false
  defensive_fallback_strategy: baseline_full_liquidity_detail
  shadow_validation:
    max_large_slippage_bps: 300
    max_unfilled_ratio: 0.20
    max_limit_up_buy_ratio: 0.20
    max_shadow_theory_gap: 0.03
    consecutive_bad_days_to_reduce: 2
    consecutive_bad_days_to_defensive: 3
  live_canary:
    # Manual-only is deliberate: this system never submits broker API orders.
    enabled: false
    execution_mode: manual_confirmation
    account_total_capital: 1000000
    max_capital_ratio: 0.10
    max_capital: 100000
    candidate_strategy: production_governed_vol_position
    require_release_approval: true
  market_regime:
    enabled: true
    confirmation_days: 3
    min_hold_days: 5
    stress_immediate: true
    regimes:
      strong_risk_on:
        target_exposure_range: [0.70, 0.85]
        allowed_pools: [trend_continuation, liquidity_quality]
        attack_budget_cap: 0.35
      normal_risk_on:
        target_exposure_range: [0.55, 0.70]
        allowed_pools: [liquidity_quality]
        attack_budget_cap: 0.20
      neutral:
        target_exposure_range: [0.35, 0.55]
        allowed_pools: [liquidity_quality, repair_reversal]
        attack_budget_cap: 0.00
      risk_off:
        target_exposure_range: [0.10, 0.35]
        allowed_pools: [liquidity_quality]
        attack_budget_cap: 0.00
      stress:
        target_exposure_range: [0.00, 0.10]
        allowed_pools: []
        attack_budget_cap: 0.00
  candidate_pools:
    liquidity_quality:
      role: champion_core
      strategy: baseline_full_liquidity_detail_vol_position
      allowed_regimes: [strong_risk_on, normal_risk_on, neutral, risk_off]
      order_lane: production
    trend_continuation:
      role: attack_challenger
      strategy: tiered_liquidity_then_bs_v2
      allowed_regimes: [strong_risk_on]
      order_lane: shadow
      max_budget_share: 0.35
    repair_reversal:
      role: research_challenger
      strategy: repair_reversal_shadow
      allowed_regimes: [neutral]
      order_lane: research
      max_budget_share: 0.00
  portfolio_risk_budget:
    max_total_exposure: 0.85
    champion_default_exposure: 0.70
    max_single_position_weight_pct_nav: 20
    max_single_industry_weight_pct_nav: 40
    max_correlated_theme_weight_pct_nav: 55
    max_daily_new_position_pct_nav: 30
    max_daily_turnover_pct_nav: 50
    max_attack_pool_budget_share: 0.35
  challenger_lanes:
    tiered_liquidity_then_bs_v2:
      lane: shadow
      candidate_pool: trend_continuation
      allowed_regimes: [strong_risk_on]
      max_budget_share: 0.35
      require_enabled_shadow_gate: true
    ashare_auto_shadow:
      lane: shadow
      candidate_pool: diversification
      allowed_regimes: [strong_risk_on, normal_risk_on]
      max_budget_share: 0.20
      require_enabled_shadow_gate: true
    dual_system_adaptive_route:
      lane: shadow
      candidate_pool: diversification
      allowed_regimes: [strong_risk_on, normal_risk_on, neutral]
      max_budget_share: 0.20
      require_enabled_shadow_gate: true
    repair_reversal_shadow:
      lane: research
      candidate_pool: repair_reversal
      allowed_regimes: [neutral]
      max_budget_share: 0.00
      require_enabled_shadow_gate: true
  # 2026-06-23 新增：基于订单前向表现诊断的优化配置
  # 诊断报告: exports/order_forward_reviews/order_dispersion_diagnosis_*.md
  score_config:
    version: v2_dispersion_fix
    description: "降低contraction/breakout权重，提升liquidity/rs权重，修复得分反转"
  industry_filter:
    enabled: true
    description: "排除持续负收益行业（基于最近一个月前向一周表现）"
    exclude_industries:
      - 火力发电     # avg_ret=-5.41%, win_rate=16.7%
      - 通信设备     # avg_ret=-1.82%, win_rate=50%
    warn_industries:
      - 矿物制品     # avg_ret=-14.95% (仅1笔，继续观察)
      - 互联网       # avg_ret=-11.35% (仅1笔)
      - 新型电力     # avg_ret=-12.85% (仅1笔)
      - IT设备       # avg_ret=-20.70% (仅1笔)
  d1_stop_loss:
    enabled: false
    description: "T+1尾盘止损规则（需代码实现后再启用）"
    threshold_3pct: 0.50   # 首日跌超3%减仓50%
    threshold_5pct: 1.00   # 首日跌超5%清仓
  recurring_stock_bonus:
    enabled: false
    description: "常胜股加分（需代码实现后再启用）"
    min_appearances: 3
    min_win_rate: 0.75
    bonus_score: 5.0
