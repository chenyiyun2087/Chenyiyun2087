schema_version: "1.0"
market_data_cutoff: "{snapshot_date}T15:30:00+08:00"
# Every query must return source, data_version and a genuine visible_at field.
# Tables not yet carrying these columns deliberately fail closed.
components:
  - {name: scores, source: chenyiyun.score_rank_daily, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [score], query: "SELECT * FROM chenyiyun.score_rank_daily WHERE trade_date <= :snapshot_date"}
  - {name: raw_prices, source: tushare_stock.dwd_stock_daily_standard, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [open, high, low, close, vol], query: "SELECT * FROM tushare_stock.dwd_stock_daily_standard WHERE trade_date <= :snapshot_date"}
  - {name: adjusted_prices, source: tushare_stock.dwd_stock_daily_standard, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [adj_open, adj_close], query: "SELECT * FROM tushare_stock.dwd_stock_daily_standard WHERE trade_date <= :snapshot_date"}
  - {name: minute_prices, source: tushare_stock.dwd_stock_minute, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [ts_code, datetime], minimum_start: "2023-01-01", required_columns: [open, high, low, close, vol], query: "SELECT * FROM tushare_stock.dwd_stock_minute WHERE trade_date <= :snapshot_date"}
  - {name: calendar, source: chenyiyun.dim_trade_cal, business_date_column: cal_date, visible_at_column: visible_at, primary_key: [exchange, cal_date], minimum_start: "2013-01-01", required_columns: [is_open], query: "SELECT * FROM chenyiyun.dim_trade_cal WHERE cal_date <= :snapshot_date"}
  - {name: corporate_actions, source: tushare_stock.ods_dividend, business_date_column: ex_date, visible_at_column: visible_at, primary_key: [ts_code, ann_date, ex_date], minimum_start: "2013-01-01", required_columns: [div_proc], query: "SELECT * FROM tushare_stock.ods_dividend WHERE ex_date <= :snapshot_date"}
  - {name: lifecycle, source: tushare_stock.dwd_stock_label_daily, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [is_st, is_suspended], query: "SELECT * FROM tushare_stock.dwd_stock_label_daily WHERE trade_date <= :snapshot_date"}
  - {name: labels, source: tushare_stock.dwd_stock_label_daily, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [is_st, is_suspended], query: "SELECT * FROM tushare_stock.dwd_stock_label_daily WHERE trade_date <= :snapshot_date"}
  - {name: index_constituents, source: tushare_stock.dwd_index_constituent_history, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [index_code, trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [weight], query: "SELECT * FROM tushare_stock.dwd_index_constituent_history WHERE trade_date <= :snapshot_date"}
  - {name: features, source: chenyiyun.score_rank_daily, business_date_column: trade_date, visible_at_column: visible_at, primary_key: [trade_date, ts_code], minimum_start: "2013-01-01", required_columns: [score], query: "SELECT * FROM chenyiyun.score_rank_daily WHERE trade_date <= :snapshot_date"}
