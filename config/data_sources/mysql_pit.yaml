# MySQL PIT Data Source Configuration v1
schema_version: "mysql_pit_datasource_v1"

provider:
  name: mysql
  driver: pymysql

connection:
  env:
    url: CHENYIYUN_DB_URL
    user: CHENYIYUN_DB_USER
    password: CHENYIYUN_DB_PASSWORD
    host: CHENYIYUN_DB_HOST
    port: CHENYIYUN_DB_PORT
    database: CHENYIYUN_DB_NAME
  defaults:
    host: localhost
    port: 3306
    database: chenyiyun
    charset: utf8mb4

transaction:
  isolation: REPEATABLE READ
  read_only: true
  consistent_snapshot: true

snapshot:
  require_gtid: true
  require_binlog_position: true
  # GTID/binlog identify replication provenance only.  They are not a
  # provider-issued immutable read-view token and must never be promoted to
  # ``provider_snapshot_token``.  Configure a real provider token query or
  # value for formal qualification; absent token => diagnostic BLOCKED_DATA.
  require_provider_snapshot_token: true
  provider_snapshot_token_query: ""
  forbid_timestamp_fallback: true
  semantic_contract: config/pit_semantics/ashare_pit_semantics_v1.yaml
  formal_cutoff_timezone: Asia/Shanghai
  formal_cutoff_default: "21:30:00"
  formal_cutoff_hard: "23:00:00"

families:
  market:
    source_table: tushare_stock.dwd_stock_daily_standard
    query_timeout_seconds: 300
  universe:
    source_table: tushare_stock.dwd_stock_label_daily
    query_timeout_seconds: 60
  financial:
    source_table: tushare_stock.dwd_daily_basic
    query_timeout_seconds: 300
  industry:
    source_table: tushare_stock.dwd_stock_label_daily
    query_timeout_seconds: 60
  adjustment:
    source_table: tushare_stock.dwd_adj_factor
    query_timeout_seconds: 120
  trade_calendar:
    source_table: chenyiyun.dim_trade_cal
    query_timeout_seconds: 30
  security_lifecycle:
    source_table: tushare_stock.dwd_stock_label_daily
    query_timeout_seconds: 60
  corporate_actions:
    source_table: tushare_stock.dwd_corporate_action_event_v2
    query_timeout_seconds: 60
  benchmark_index:
    source_table: tushare_stock.ods_index_daily
    required_codes: ["000300.SH", "000905.SH", "000852.SH"]
    query_timeout_seconds: 120
