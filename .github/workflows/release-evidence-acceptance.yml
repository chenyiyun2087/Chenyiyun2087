name: release-evidence-acceptance

on:
  workflow_dispatch:
    inputs:
      evidence_root:
        description: Absolute path mounted by the self-hosted runner
        required: true
        type: string
      evidence_replica_root:
        description: Distinct mounted replica path on the self-hosted runner
        required: true
        type: string
      pit_manifest:
        description: Absolute path to the verified PIT manifest
        required: true
        type: string
      dual_ledger_package:
        description: Absolute path to the frozen dual-ledger input package
        required: true
        type: string
      full_history_package:
        description: Content-addressed V2 full-history acceptance JSON
        required: true
        type: string
      allow_local_root_readonly:
        description: Explicit local-only root exception; keep false for normal acceptance
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  frozen-evidence:
    runs-on: self-hosted
    env:
      CHENYIYUN_EVIDENCE_ROOT: ${{ inputs.evidence_root }}
      CHENYIYUN_EVIDENCE_REPLICA_ROOT: ${{ inputs.evidence_replica_root }}
      CHENYIYUN_DB_URL: ${{ secrets.CHENYIYUN_READ_ONLY_DB_URL }}
      CHENYIYUN_DB_READ_ONLY: '1'
      CHENYIYUN_ALLOW_LOCAL_PRIVILEGED_READONLY: ${{ inputs.allow_local_root_readonly && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-ci.lock.txt
      - name: Verify content-addressed evidence
        run: python scripts/maintenance/manage_evidence_store.py verify
      - name: Verify frozen PIT snapshot and replica
        run: python scripts/ops/verify_pit_snapshot.py --manifest "${{ inputs.pit_manifest }}"
      - name: Audit all fourteen PIT V2 source contracts read-only
        run: python scripts/maintenance/audit_pit_v2_sources.py --output /tmp/pit-v2-source-audit.json
      - name: Verify complete 2013+ account-level research evidence
        run: python scripts/research/validate_full_history_v2_evidence.py --input "${{ inputs.full_history_package }}"
      - name: Run real dual-ledger acceptance package
        run: python scripts/research/run_dual_ledger_acceptance.py --package "${{ inputs.dual_ledger_package }}" --output /tmp/dual-ledger-acceptance
      - name: Strict and independent ledger gates
        run: >-
          python -m pytest -q
          test/test_strict_execution_ledger.py
          test/test_replay_strict_execution_ledger.py
          test/test_trusted_production_closure.py
          test/test_pr18_independent_oracle.py
          test/test_pr19_oracle_coverage.py
          test/test_comprehensive_trust_upgrade.py
          test/test_quant_validation_v2.py
          regression/tests
      - name: Require read-only database credential
        run: test -n "$CHENYIYUN_DB_URL"
