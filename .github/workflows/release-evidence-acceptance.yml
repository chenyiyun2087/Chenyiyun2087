name: release-evidence-acceptance

on:
  workflow_dispatch:
    inputs:
      evidence_root:
        description: Absolute path mounted by the self-hosted runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  frozen-evidence:
    runs-on: self-hosted
    env:
      CHENYIYUN_EVIDENCE_ROOT: ${{ inputs.evidence_root }}
      CHENYIYUN_DB_URL: ${{ secrets.CHENYIYUN_READ_ONLY_DB_URL }}
      CHENYIYUN_DB_READ_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-ci.lock.txt
      - name: Verify content-addressed evidence
        run: python scripts/maintenance/manage_evidence_store.py verify
      - name: Strict and independent ledger gates
        run: >-
          python -m pytest -q
          test/test_strict_execution_ledger.py
          test/test_replay_strict_execution_ledger.py
          test/test_trusted_production_closure.py
          test/test_pr18_independent_oracle.py
          test/test_pr19_oracle_coverage.py
      - name: Require read-only database credential
        run: test -n "$CHENYIYUN_DB_URL"
