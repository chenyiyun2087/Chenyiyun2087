name: production-core-audit

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  production-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-ci.lock.txt
      - name: Production config consistency
        run: python -m pytest test/test_production_config_consistency.py test/test_p0_trustworthiness.py test/test_trusted_production_closure.py test/test_comprehensive_trust_upgrade.py -v
      - name: PR18 Independent Oracle and Evidence Semantic tests
        run: python -m pytest test/test_pr18_independent_oracle.py -v
      - name: PR19 Oracle Coverage and Evidence Gates
        run: python -m pytest test/test_pr19_oracle_coverage.py -v
      - name: Runtime and batch pipeline integrity
        run: python -m pytest test/test_batch_reliability.py -v
      - name: Production config loads correctly
        run: |
          python -c "
          import sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd()));
          from scripts.ops.production_config import load_production_config;
          config = load_production_config();
          assert config['primary_strategy'] == 'production_governed_vol_position';
          assert config['primary_selection_strategy'] == 'baseline_full_liquidity_detail_vol_position';
          assert 'config_sha' in config;
          print('OK: production_config loads, strategy=', config['primary_strategy']);
          "
      - name: Strategy display names load
        run: |
          python -c "
          from scripts.strategy_display import strategy_display_name, STRATEGY_DISPLAY_NAMES;
          assert len(STRATEGY_DISPLAY_NAMES) >= 20;
          name = strategy_display_name('production_governed_vol_position');
          assert name != 'production_governed_vol_position';
          name_with_id = strategy_display_name('production_governed_vol_position', include_id=True);
          assert 'production_governed_vol_position' in name_with_id;
          print('OK: all', len(STRATEGY_DISPLAY_NAMES), 'display names load');
          "
      - name: No plaintext passwords in scheduler.py
        run: '! grep -E "root:.*@" scheduler.py'
      - name: No duplicated Feishu functions
        run: '! grep -rn "def _load_feishu_webhook\|def _send_feishu_text" scripts/ops/'
      - name: Feishu notifier module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.feishu_notifier import strategy_identity_block, load_feishu_webhook, send_feishu_text;
          print('OK: feishu_notifier module loads');
          "
      - name: Data readiness gate module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.data_readiness_gate import PreScoreGate, PostScoreGate;
          g = PreScoreGate.__name__;
          print('OK: PreScoreGate/PostScoreGate classes load, gate_version=3.0');
          "
      - name: Strategy release registry module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.strategy_release_registry import DDL_RELEASE_REGISTRY, DDL_RELEASE_AUDIT_LOG;
          assert 'strategy_release_registry' in DDL_RELEASE_REGISTRY;
          assert 'strategy_release_audit_log' in DDL_RELEASE_AUDIT_LOG;
          print('OK: strategy_release_registry DDL loads');
          "
      - name: Order repository module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.order_repository import ensure_order_schema, supersede_pending_buys;
          print('OK: order_repository loads (ensure_order_schema + supersede_pending_buys)');
          "
      - name: Health order gating tests
        run: python -m pytest test/test_production_health_order_gating.py -v
      - name: Governance chain fail-closed tests
        run: python -m pytest test/test_strategy_governance_chain.py -v
      - name: Fixture tests (no DB needed)
        run: python -m pytest test/test_project_network.py test/test_production_risk_governor.py test/test_db_connection_config.py -v

  strict-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-ci.lock.txt
      - name: Strict ledger tests
        run: python -m pytest test/test_strict_execution_ledger.py test/test_strict_corporate_action_snapshot.py test/test_strict_snapshot_integrity.py test/test_strict_reliability_matrix.py test/test_strict_precommit_cap_and_sizing.py test/test_strict_pit_market_rules.py test/test_replay_strict_execution_ledger.py test/test_trusted_production_closure.py -v
      - name: No research imports in replay_v2
        run: '! grep -E "from scripts\.research\.strict_execution_ledger|research_trusted_strategy_account_backtest" scripts/research/replay_strict_execution_ledger_v2.py'

  integration-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: order_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-ci.lock.txt
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -u root -ptest_password --silent; then
              echo "MySQL ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done
      - name: Setup test schema and trade calendar
        run: |
          mysql -h 127.0.0.1 -u root -ptest_password -e "CREATE DATABASE IF NOT EXISTS chenyiyun"
          mysql -h 127.0.0.1 -u root -ptest_password order_test_db << 'SQL'
          CREATE TABLE IF NOT EXISTS chenyiyun.dim_trade_cal (
            cal_date DATE PRIMARY KEY,
            exchange VARCHAR(8),
            is_open TINYINT(1)
          );
          INSERT INTO chenyiyun.dim_trade_cal (cal_date, exchange, is_open) VALUES
            ('2026-06-19', 'SSE', 1),
            ('2026-06-22', 'SSE', 1),
            ('2026-06-23', 'SSE', 1),
            ('2026-06-24', 'SSE', 1),
            ('2026-06-25', 'SSE', 1),
            ('2026-06-26', 'SSE', 1),
            ('2026-06-29', 'SSE', 1),
            ('2026-06-30', 'SSE', 1)
          ON DUPLICATE KEY UPDATE is_open = VALUES(is_open);
          SQL
      - name: Run order v2 integration tests
        env:
          ORDER_TEST_DB_URL: mysql+pymysql://root:test_password@127.0.0.1:3306/order_test_db
        run: python -m pytest test/test_order_v2_migration_integration.py -v
      - name: Reject skipped database integration tests
        env:
          ORDER_TEST_DB_URL: mysql+pymysql://root:test_password@127.0.0.1:3306/order_test_db
        run: python -m pytest test/test_order_v2_migration_integration.py -q -rs | tee /tmp/db-tests.txt && ! grep -q "SKIPPED" /tmp/db-tests.txt

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject hard-coded database password defaults
        run: python scripts/ops/check_no_hardcoded_db_credentials.py
