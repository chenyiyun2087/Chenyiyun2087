name: production-core-audit

on:
  push:
  pull_request:

jobs:
  production-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pytest sqlalchemy pymysql pyyaml
      - name: Production config consistency
        run: python -m pytest test/test_production_config_consistency.py -v
      - name: Scheduler pipeline integrity
        run: python -m pytest test/test_scheduler_pipeline.py -v
      - name: Production config loads correctly
        run: |
          python -c "
          import sys; from pathlib import Path; sys.path.insert(0, str(Path.cwd()));
          from scripts.ops.production_config import load_production_config;
          config = load_production_config();
          assert config['primary_strategy'] == 'production_governed_vol_position';
          assert config['primary_selection_strategy'] == 'baseline_full_liquidity_detail_vol_position';
          assert 'config_sha' in config;
          print('OK: production_config loads, strategy=', config['primary_strategy']);
          "
      - name: Strategy display names load
        run: |
          python -c "
          from scripts.strategy_display import strategy_display_name, STRATEGY_DISPLAY_NAMES;
          assert len(STRATEGY_DISPLAY_NAMES) >= 20;
          name = strategy_display_name('production_governed_vol_position');
          assert name != 'production_governed_vol_position';
          name_with_id = strategy_display_name('production_governed_vol_position', include_id=True);
          assert 'production_governed_vol_position' in name_with_id;
          print('OK: all', len(STRATEGY_DISPLAY_NAMES), 'display names load');
          "
      - name: No plaintext passwords in scheduler.py
        run: '! grep -E "root:.*@" scheduler.py'
      - name: No duplicated Feishu functions
        run: '! grep -rn "def _load_feishu_webhook\|def _send_feishu_text" scripts/ops/'
      - name: Feishu notifier module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.feishu_notifier import strategy_identity_block, load_feishu_webhook, send_feishu_text;
          print('OK: feishu_notifier module loads');
          "
      - name: Data readiness gate module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.data_readiness_gate import DataReadinessGate;
          print('OK: DataReadinessGate class loads, gate_version=1.0');
          "
      - name: Strategy release registry module loads
        run: |
          python -c "
          import sys; sys.path.insert(0, '.');
          from scripts.ops.strategy_release_registry import DDL_RELEASE_REGISTRY, DDL_RELEASE_AUDIT_LOG;
          assert 'strategy_release_registry' in DDL_RELEASE_REGISTRY;
          assert 'strategy_release_audit_log' in DDL_RELEASE_AUDIT_LOG;
          print('OK: strategy_release_registry DDL loads');
          "
      - name: Fixture tests (no DB needed)
        run: python -m pytest test/test_project_network.py test/test_production_risk_governor.py test/test_db_connection_config.py -v

  strict-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy pytest sqlalchemy pymysql
      - name: Strict ledger tests
        run: python -m pytest test/test_strict_execution_ledger.py test/test_strict_corporate_action_snapshot.py test/test_strict_snapshot_integrity.py test/test_strict_reliability_matrix.py test/test_strict_precommit_cap_and_sizing.py test/test_strict_pit_market_rules.py test/test_replay_strict_execution_ledger.py -v
      - name: No research imports in replay_v2
        run: '! grep -E "from scripts\.research\.strict_execution_ledger|research_trusted_strategy_account_backtest" scripts/research/replay_strict_execution_ledger_v2.py'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
