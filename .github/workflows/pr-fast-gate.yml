name: pr-fast-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-ci.lock.txt
      - name: Compile production modules
        run: python -m compileall -q runtime scripts/ops scripts/research web
      - name: Production contracts and PIT/risk invariants
        run: >-
          python -m pytest -q
          test/test_trusted_production_closure.py
          test/test_p0_trustworthiness.py
          test/test_production_config_consistency.py
          test/test_production_health_order_gating.py
          test/test_quant_validation_v2.py
          regression/tests
      - name: Enforce canonical portfolio entry point
        run: >-
          ! rg "from scripts\\.research\\.alpha_risk_portfolio|import RiskPortfolioBuilder"
          runtime scripts scoreRank
          --glob '!scripts/research/alpha_risk_portfolio.py'
      - name: Verify fixed-capital release freeze
        run: >-
          python scripts/ops/verify_release_freeze.py
          --freeze config/release_freeze/prod-fixed-v2-20260720-01.json
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/ops/check_no_hardcoded_db_credentials.py
