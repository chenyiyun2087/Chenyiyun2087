name: strict-ledger-audit

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-ci.lock.txt
      - run: >-
          python -m pytest -q
          test/test_p0_trustworthiness.py
          test/test_strict_execution_ledger.py
          test/test_strict_corporate_action_snapshot.py
          test/test_strict_snapshot_integrity.py
          test/test_strict_reliability_matrix.py
          test/test_strict_precommit_cap_and_sizing.py
          test/test_strict_pit_market_rules.py
          test/test_replay_strict_execution_ledger.py
          test/test_pr21_fold_account_backtest.py
          test/test_trusted_production_closure.py
          test/test_alpha_challengers.py
          test/test_challenger_ranking_integrity.py
          test/test_scheduler_dependency_graph.py
          test/test_t1_execution_calendar.py
          test/test_directional_limit_rules.py
          test/test_active_model_fail_closed.py
          test/test_forward_shadow_state_machine.py
          test/test_forward_shadow_immutability.py
          test/test_forward_shadow_package.py
          test/test_forward_shadow_e2e_chain.py
          test/test_forward_shadow_live_prices.py
          test/test_pit_universe_contract.py
          test/test_f2_liquidity_consistency.py
          test/test_residualize_scores.py
          test/test_scd_overlap_guard.py
          test/test_shadow_events_replay.py
          test/test_shadow_sell_decisions.py
          test/test_shadow_virtual_account.py
      - run: '! rg "from scripts\.research\.strict_execution_ledger|research_trusted_strategy_account_backtest" scripts/research/replay_strict_execution_ledger_v2.py'
  freeze-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Verify alpha-challenger pre-registration integrity
        run: |
          python - <<'EOF'
          import hashlib, pathlib, sys
          import yaml

          errors = []
          manifest_path = pathlib.Path("config/experiments/alpha_rebuild_202608.yaml")
          if not manifest_path.exists():
              print("no alpha_rebuild manifest — skipping (pre-registration not started)")
              sys.exit(0)
          manifest = yaml.safe_load(manifest_path.read_text(encoding="utf-8"))
          shas = manifest.get("pre_registration_shas", {})
          # Factor fields are required only for factor-composite challengers.
          # Independent sleeves (e.g. b_sleeve_independent, EVENT_DRIVEN)
          # have no factor_weights/factor_signs by design.
          required_fields = ["challenger_id", "experiment_id", "hypothesis_id",
                             "execution", "selection_window", "untouched_evaluation_window"]
          factor_fields = ["factor_weights", "factor_signs"]
          for cid, expected in sorted(shas.items()):
              path = pathlib.Path(f"config/alpha_challengers/{cid}.yaml")
              if not path.exists():
                  errors.append(f"{cid}: file missing")
                  continue
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  errors.append(f"{cid}: DRIFTED (expected {expected[:12]}…, got {actual[:12]}…)")
              try:
                  data = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
              except Exception as exc:
                  errors.append(f"{cid}: yaml parse failed: {exc}")
                  continue
              missing = [f for f in required_fields if f not in data]
              if data.get("sleeve_type") != "EVENT_DRIVEN":
                  missing += [f for f in factor_fields if f not in data]
              if missing:
                  errors.append(f"{cid}: missing {missing}")
              if data.get("challenger_id") != cid:
                  errors.append(f"{cid}: challenger_id mismatch")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"freeze-integrity OK: {len(shas)} challengers verified against pre-registration SHAs")
          EOF
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject hard-coded database password defaults
        run: python scripts/ops/check_no_hardcoded_db_credentials.py
