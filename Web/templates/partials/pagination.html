{% if pagination and pagination.pages > 1 %}
<div class="pagination">
    {% if pagination.has_prev %}
    <a
        href="{{ url_for(request.endpoint, page=pagination.prev_num, sort=sort_by, order=order, min_s=min_s, min_o=min_o) }}">上一页</a>
    {% endif %}
    <span>第 {{ pagination.page }} / {{ pagination.pages }} 页</span>
    {% if pagination.has_next %}
    <a
        href="{{ url_for(request.endpoint, page=pagination.next_num, sort=sort_by, order=order, min_s=min_s, min_o=min_o) }}">下一页</a>
    {% endif %}
</div>
{% endif %}
