# 系统配置文件
system:
  base_dir: "./outputs"
  data_dir: "./data"
  log_level: "INFO"

# 数据源配置
data:
  source: "akshare"  # 数据源: akshare, tushare等
  adjust: "qfq"      # 复权方式: qfq(前复权), hfq(后复权), none(不复权)
  
# 样本池配置
universe:
  # 市场范围
  markets: ["主板", "创业板", "科创板"]
  
  # 过滤条件
  filters:
    exclude_st: true              # 排除ST股票
    exclude_suspended: true        # 排除停牌股票
    min_float_mv: 500000000       # 最小流通市值(元): 5亿
    min_avg_amount20: 10000000    # 最小20日平均成交额(元): 1000万
    
# 基准配置
benchmark:
  index_code: "000300"  # 沪深300
  name: "沪深300"

# 成本参数
costs:
  # 印花税(卖出时征收，2023年减半后)
  stamp_tax: 0.0005      # 0.1% * 0.5 = 0.05%
  
  # 过户费(双向)
  transfer_fee: 0.00001  # 0.001%
  
  # 佣金(双向)
  commission_rate: 0.0003  # 0.03%
  commission_min: 5        # 最低5元
  
  # 滑点(单边)
  slippage: 0.001        # 0.1%

# 因子权重配置(文档建议值)
factor_weights:
  breakout: 0.22
  trend: 0.12
  volume: 0.12
  rs: 0.12
  liquidity: 0.10
  contraction: 0.10

# 因子参数
factor_params:
  # Breakout因子
  breakout:
    window: 120              # Donchian通道周期
    extension_decay: 0.02    # 延伸惩罚系数
    extension_threshold: 10  # 延伸阈值(日)
    
  # Trend因子
  trend:
    ma_short: 20
    ma_mid: 60
    ma_long: 120
    slope_window: 10
    
  # Volume因子
  volume:
    window: 20
    ratio_threshold: 1.5
    
  # RS因子(相对强度)
  rs:
    window: 20
    benchmark: "000300"
    
  # Liquidity因子
  liquidity:
    window: 20
    amihud_window: 20
    
  # Contraction因子
  contraction:
    bb_window: 20
    bb_std: 2
    atr_window: 14

# 买卖点信号参数
signals:
  # 买点规则
  entry:
    # 价格突破
    price_above_pivot: true
    pivot_lookback: 120
    
    # 成交量确认
    volume_confirm: true
    volume_ratio: 1.5
    
    # 技术指标确认
    price_above_ma20: true
    
  # 卖点规则
  exit:
    # 跌破关键支撑
    break_ma20: true
    
    # 价格下穿
    trail_stop_pct: 0.08  # 8%跟踪止损
    
    # 时间止损
    max_hold_days: 60

# 分层阈值配置
thresholds:
  # 使用分位数阈值(推荐)
  use_percentile: true
  
  # 分位数阈值
  percentile:
    trade: 0.90      # Top 10%
    watch_high: 0.90 # Top 10%
    watch_low: 0.60  # Top 40%
    
  # 绝对分数阈值(备选)
  absolute:
    trade: 75
    watch_high: 75
    watch_low: 60

# 回测配置
backtest:
  # 回测窗口
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  
  # 初始资金
  initial_capital: 1000000
  
  # 持仓配置
  max_positions: 10        # 最大持仓数
  position_size: 0.1       # 每个仓位占比
  
  # 再平衡
  rebalance_freq: "daily"  # daily, weekly, monthly
  
  # 执行假设
  execution_time: "open"   # open(开盘), close(收盘), vwap
  signal_delay: 1          # 信号延迟(天): T日收盘信号，T+1日执行

# 验证配置
validation:
  # IC分析
  ic:
    horizons: [5, 10, 20]  # 持有期
    
  # 分组分析
  quantile_analysis:
    n_groups: 5
    
  # 统计检验
  statistical_tests:
    bootstrap_n: 1000
    confidence_level: 0.95
    use_reality_check: true
    use_deflated_sharpe: true

# 输出配置
output:
  # 每日输出
  daily:
    trade_list: true
    watch_list: true
    charts: true
    
  # 回测输出
  backtest:
    summary: true
    nav_curve: true
    factor_analysis: true
    detailed_trades: true
